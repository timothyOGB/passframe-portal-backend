<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PassFrame Portal</title>
<meta name="description" content="Tutor and parent portal for PassFrame Tuition: availability, booking and lesson resources.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1e1633;
    --muted: #5b5170;
    --wash: #f7f2fd;
    --line: #e5dbf4;
    --brand: #8b2be2;
    --brand-text: #7a1fd0;
    --deep: #4a1290;
    --tint: #d3aef7;
    --on-brand: #ffffff;
    --glow: rgba(139, 43, 226, 0.12);
    --ok: #1a7a4c;
    --ok-wash: #eaf8f1;
    --warn: #b5530a;
    --warn-wash: #fdf2e6;
    --blue: #1d5fc9;
    --blue-wash: #e3edfc;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --text: "Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #130f1f;
      --ink: #f3eefb;
      --muted: #b6abcd;
      --wash: #1b1530;
      --line: #352a50;
      --brand: #9b45ee;
      --brand-text: #c393ff;
      --deep: #7a35d6;
      --tint: #5f3f93;
      --glow: rgba(155, 69, 238, 0.2);
      --ok: #4fd18e;
      --ok-wash: #103524;
      --warn: #f0a15c;
      --warn-wash: #3a2610;
      --blue: #7fb0ff;
      --blue-wash: #17253f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: var(--display); color: var(--ink); margin: 0 0 8px; line-height: 1.15; }
  p { margin: 0 0 12px; }
  a { color: var(--brand-text); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  header.top {
    border-bottom: 1px solid var(--line);
    padding: 18px 0;
    background: var(--wash);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand-mark { font-family: var(--display); font-weight: 800; font-size: 1.3rem; color: var(--brand); text-decoration: none; }
  .brand-mark span { display: block; font-size: 0.55rem; letter-spacing: 0.14em; color: var(--brand); font-weight: 600; }
  .top-actions { display: flex; align-items: center; gap: 14px; }
  .who { font-size: 0.92rem; color: var(--muted); }
  .who strong { color: var(--ink); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--display); font-weight: 700; font-size: 0.92rem;
    padding: 10px 18px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--brand); color: var(--on-brand); text-decoration: none;
  }
  .btn:hover { background: var(--deep); }
  .btn.secondary { background: transparent; color: var(--brand-text); border: 1.5px solid var(--line); }
  .btn.secondary:hover { border-color: var(--brand); }
  .btn.small { padding: 6px 14px; font-size: 0.82rem; }
  .btn.danger { background: transparent; color: #c23b3b; border: 1.5px solid #e8c5c5; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  main { padding: 40px 0 80px; min-height: 60vh; }
  .banner {
    border-radius: 14px; padding: 14px 18px; margin-bottom: 24px;
    font-size: 0.92rem; display: flex; gap: 10px; align-items: flex-start;
  }
  .banner.info { background: var(--wash); color: var(--muted); border: 1px solid var(--line); }
  .banner.warn { background: var(--warn-wash); color: var(--warn); border: 1px solid var(--warn); }
  .banner.ok { background: var(--ok-wash); color: var(--ok); border: 1px solid var(--ok); }
  .card {
    background: var(--wash); border: 1px solid var(--line); border-radius: 18px;
    padding: 24px clamp(18px, 4vw, 32px); margin-bottom: 20px;
  }
  .card h3 { font-size: 1.05rem; }
  label { display: block; font-family: var(--display); font-weight: 600; font-size: 0.85rem; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select, textarea {
    width: 100%; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit; font-size: 0.96rem;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
  .tab-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1; padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--muted); font-family: var(--display); font-weight: 700;
    font-size: 0.85rem; cursor: pointer;
  }
  .tab-btn[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .tab-btn.small { flex: none; padding: 6px 12px; font-size: 0.76rem; }
  .preset-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-btn {
    display: inline-block; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--brand-text); font-family: var(--display); font-weight: 700;
    font-size: 0.82rem; cursor: pointer; text-decoration: none;
  }
  .preset-btn:hover { border-color: var(--brand); background: var(--wash); }
  .msg { font-size: 0.88rem; margin-top: 10px; }
  .msg.error { color: #c23b3b; }
  .msg.ok { color: var(--ok); }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex: none;
    background: var(--brand); color: var(--on-brand); display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 700; font-size: 1.3rem;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hello-row { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .hello-row h2 { font-size: 1.5rem; margin-bottom: 2px; }
  .role-tag { display: inline-block; background: var(--tint); color: var(--deep); font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; font-family: var(--display); }
  .role-tag.small { font-size: 0.66rem; padding: 2px 8px; }
  .student-badge { display: inline-block; background: var(--blue-wash); color: var(--blue); font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; font-family: var(--display); }
  .student-badge.small { font-size: 0.66rem; padding: 2px 8px; }
  .hello-row .role-tag, .hello-row .student-badge { margin-left: 2px; }
  .founder-badge { display: inline-block; background: linear-gradient(135deg, #f6d675, #d3a627); color: #4a3300; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; font-family: var(--display); letter-spacing: 0.02em; }
  .hello-row .founder-badge { margin-right: 6px; }
  .empty { color: var(--muted); font-size: 0.9rem; font-style: italic; padding: 10px 0; }
  .cat-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .res-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; margin-bottom: 8px;
  }
  .res-item a { font-weight: 600; }
  .res-meta { font-size: 0.78rem; color: var(--muted); }
  .hidden { display: none !important; }

  /* Hero (logged out) */
  .hero-panel { text-align: center; max-width: 560px; margin: 40px auto 0; }
  .hero-panel h1 { font-size: clamp(1.8rem, 4vw, 2.3rem); }
  .hero-panel p { color: var(--muted); }
  .hero-panel .btn { margin-top: 12px; padding: 13px 28px; font-size: 1rem; }
  .hero-points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 36px; text-align: left; }
  @media (max-width: 640px) { .hero-points { grid-template-columns: 1fr; } }
  .hero-point { background: var(--wash); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .hero-point strong { display: block; font-family: var(--display); font-size: 0.95rem; margin-bottom: 4px; }
  .hero-point span { font-size: 0.85rem; color: var(--muted); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20, 12, 36, 0.5); z-index: 90;
    display: none; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto;
  }
  .modal-backdrop.show { display: flex; }
  .modal-card {
    background: var(--bg); border-radius: 20px; padding: clamp(22px, 4vw, 32px);
    max-width: 460px; width: 100%; position: relative; box-shadow: 0 24px 60px rgba(20, 6, 50, 0.3);
  }
  .modal-card.wide { max-width: 640px; }
  .modal-close {
    position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%;
    border: none; background: var(--wash); color: var(--muted); font-size: 1.1rem; cursor: pointer; line-height: 1;
  }
  .modal-close:hover { background: var(--tint); color: var(--deep); }

  /* Month calendar */
  #tutorCal, #parentCal { max-width: 320px; margin: 0 auto; }
  .cal-month-head { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; margin-bottom: 10px; }
  .cal-month-head h3 { margin: 0; font-size: 0.95rem; }
  .cal-nav {
    width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg);
    color: var(--brand-text); font-size: 1rem; cursor: pointer; line-height: 1; flex: none;
  }
  .cal-nav:hover:not(:disabled) { border-color: var(--brand); background: var(--wash); }
  .cal-nav:disabled { opacity: 0.35; cursor: not-allowed; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px; }
  .cal-weekdays span { text-align: center; font-family: var(--display); font-weight: 700; font-size: 0.6rem; color: var(--muted); }
  .cal-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-cell {
    aspect-ratio: 1 / 1; border-radius: 7px; border: 1.5px solid var(--line); background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    cursor: pointer; font: inherit; color: var(--ink); position: relative; padding: 1px;
  }
  .cal-cell.empty { visibility: hidden; cursor: default; border: none; }
  .cal-cell:hover:not(:disabled) { border-color: var(--brand); }
  .cal-cell:disabled { opacity: 0.32; cursor: not-allowed; }
  .cal-cell.today { border-color: var(--brand); border-width: 2px; }
  .cal-cell.has-slots { background: var(--wash); }
  .cal-cell.has-available { background: var(--tint); border-color: var(--brand); }
  .cal-cell.has-selected { background: var(--brand); border-color: var(--brand); }
  .cal-cell.has-selected .cal-daynum { color: var(--on-brand); }
  .cal-daynum { font-family: var(--display); font-weight: 700; font-size: 0.68rem; }
  .cal-badge {
    font-size: 0.5rem; font-weight: 700; font-family: var(--display); color: var(--brand-text);
    background: var(--bg); border-radius: 999px; padding: 0 4px; line-height: 1.3; min-width: 12px; text-align: center;
  }
  .cal-cell.has-selected .cal-badge { color: var(--brand); }
  @media (max-width: 380px) { #tutorCal, #parentCal { max-width: 100%; } .cal-daynum { font-size: 0.62rem; } .cal-badge { font-size: 0.46rem; } }

  .day-slot-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  .day-slot-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--wash); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 0.85rem;
  }
  .day-slot-main strong { font-family: var(--display); display: block; }
  .day-slot-main span { color: var(--muted); font-size: 0.78rem; }
  .day-slot-item.completed { border-color: var(--ok); background: var(--ok-wash); }
  .day-slot-actions { display: flex; align-items: center; gap: 10px; flex: none; }
  .slot-complete { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .slot-complete input { width: 15px; height: 15px; margin: 0; }
  .checkbox-row { display: flex; align-items: center; gap: 9px; margin: 16px 0 0; cursor: pointer; }
  .checkbox-row input { width: 16px; height: 16px; margin: 0; flex: none; }
  .tutor-row-avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex: none; background: var(--brand-wash); color: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
  .tutor-row-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .tutor-row { display: flex; align-items: center; gap: 12px; }
  .founder-badge.small { font-size: 0.68rem; padding: 2px 8px; }
  .tutor-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tutor-pick-btn {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; font: inherit; font-size: 0.85rem; color: var(--ink);
  }
  .tutor-pick-btn:hover { border-color: var(--brand); }
  .tutor-pick-btn[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .tutor-pick-avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--tint); color: var(--deep);
    display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 0.78rem; overflow: hidden; flex: none;
  }
  .tutor-pick-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0; }
  .stat-tile {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 130px; flex: 1;
  }
  .stat-tile strong { display: block; font-family: var(--display); font-size: 1.3rem; }
  .stat-tile span { color: var(--muted); font-size: 0.78rem; }
  .cal-with-sidebar { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .cal-with-sidebar .cal-main { flex: 2 1 260px; min-width: 260px; }
  .cal-with-sidebar .cal-sidebar { flex: 1 1 150px; min-width: 150px; display: flex; flex-direction: column; gap: 10px; }
  .cal-with-sidebar .cal-sidebar .stat-tile { min-width: 0; }
  .back-link { display: inline-block; margin-bottom: 12px; color: var(--brand-text); font-weight: 600; font-size: 0.85rem; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
  .back-link:hover { text-decoration: underline; }
  .credential-box { background: var(--brand-wash); border: 1px solid var(--brand); border-radius: 10px; padding: 9px 14px; font-size: 0.85rem; margin-bottom: 12px; }
  .credential-box strong { font-family: var(--mono, inherit); letter-spacing: 0.02em; }
  .slot-credentials { color: var(--muted); font-size: 0.8rem; }

  .card.accordion { padding: 0; }
  .card.accordion > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 20px clamp(18px, 4vw, 32px); font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--ink);
    -webkit-tap-highlight-color: transparent; border-radius: 18px;
  }
  .card.accordion > summary::-webkit-details-marker { display: none; }
  .card.accordion > summary::marker { content: ""; }
  .card.accordion > summary:hover { background: var(--bg); }
  .card.accordion[open] > summary { border-bottom: 1px solid var(--line); border-radius: 18px 18px 0 0; }
  .card.accordion .chevron { flex: none; color: var(--muted); transition: transform 0.2s ease; display: inline-flex; }
  .card.accordion[open] .chevron { transform: rotate(180deg); }
  .card.accordion > .accordion-body { padding: 20px clamp(18px, 4vw, 32px) 24px; }
  .day-slot-select {
    width: 100%; text-align: left; border-radius: 12px; padding: 10px 12px; font-size: 0.85rem;
    background: var(--bg); border: 1.5px solid var(--line); cursor: pointer; font: inherit; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .day-slot-select strong { font-family: var(--display); }
  .day-slot-select span { color: var(--muted); font-size: 0.78rem; }
  .day-slot-select:hover:not(:disabled) { border-color: var(--brand); }
  .day-slot-select.selected { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .day-slot-select.selected span { color: var(--on-brand); opacity: 0.85; }
  .day-slot-select:disabled { opacity: 0.5; cursor: not-allowed; }
  .day-slot-select.booked { background: var(--ok-wash); border-color: var(--ok); color: var(--ok); cursor: default; }

  .slot-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .slot-main { display: flex; flex-direction: column; gap: 2px; }
  .slot-day { font-family: var(--display); font-weight: 700; }
  .slot-time { color: var(--muted); font-size: 0.88rem; }

  .actions-menu { position: relative; flex: none; }
  .actions-dropdown {
    display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; min-width: 150px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 28px rgba(20, 6, 50, 0.18);
  }
  .actions-dropdown.show { display: block; }
  .menu-item {
    display: block; width: 100%; text-align: left; padding: 10px 14px; border: none; background: none;
    font: inherit; font-size: 0.88rem; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .menu-item:hover { background: var(--wash); }
  .menu-item.danger { color: #c23b3b; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand-mark" href="#">PassFrame<span>PORTAL</span></a>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer style="border-top:1px solid var(--line); padding:24px 0; text-align:center; color:var(--muted); font-size:0.85rem;">
  <p>PassFrame Tuition &middot; Staff &amp; family portal</p>
</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalCloseBtn" type="button" aria-label="Close">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var state = { user: null, sessionToken: null };

  var COHORTS = [
    { id: "y4-11plus", label: "Year 4 · 11+" },
    { id: "y4pt2-11plus", label: "Year 4 Pt 2 · 11+" },
    { id: "y5-11plus", label: "Year 5 Accelerated · 11+" }
  ];
  // A student's board decides which board-restricted topics they see in the Worksheet Library
  // (most topics are shared by Kent and Bexley — only a handful, like NVR paper-folding, are
  // board-specific). "combined" (Kent & Bexley) sees everything, restricted or not.
  var BOARDS = [
    { id: "kent", label: "Kent" },
    { id: "bexley", label: "Bexley" },
    { id: "combined", label: "Kent & Bexley" }
  ];
  var RES_CATEGORIES = ["Mark schemes", "Lessons", "Homework", "Resource lists"];
  var RES_SUBJECTS = ["Maths", "English", "Verbal Reasoning", "Non-Verbal Reasoning"];
  var RES_CATEGORIES_WITH_SUBJECTS = ["Mark schemes", "Lessons", "Homework"];
  // Year group only applies once a subject is picked (Mark schemes/Lessons/Homework) — a Year 4
  // student and a Year 5 Accelerated student work through the same topic bank at different
  // depth/pace, so each topic's content is written separately per year group. Ids match COHORTS.
  var RES_YEARGROUPS = [
    { id: "y4-11plus", label: "Year 4" },
    { id: "y4pt2-11plus", label: "Year 4 Pt 2" },
    { id: "y5-11plus", label: "Year 5" }
  ];
  // The Syllabus section (tutor portal only) links straight to PDFs published alongside this
  // page, rather than going through the assets/db resource store — those files are baked into
  // the artifact itself, so they load for anyone who can open the portal, with no extra
  // capability grant or database round-trip involved.
  var SYLLABUS_FILES = [
    { title: "Kent Syllabus 2026/27 (Year 4 · Year 4 Pt 2 · Year 5 Accelerated)", href: "syllabus/kent.pdf" },
    { title: "Bexley Syllabus 2026/27 (Year 4 · Year 4 Pt 2 · Year 5 Accelerated)", href: "syllabus/bexley.pdf" },
    { title: "Kent & Bexley Combined Syllabus 2026/27 (Year 4 · Year 4 Pt 2 · Year 5 Accelerated)", href: "syllabus/kent-bexley.pdf" }
  ];
  // Worksheet Library: per-topic Lesson Worksheet / Homework Worksheet / Mark Scheme, published
  // as static PDFs alongside this page (same pattern as SYLLABUS_FILES above). Maths and English

  function topicVisibleForBoard(topic, board) {

  function esc(s) {

  // ---------- calendar date helpers ----------
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function isoDate(y, mIdx, d) { return y + "-" + pad2(mIdx + 1) + "-" + pad2(d); }
  function daysInMonth(y, mIdx) { return new Date(y, mIdx + 1, 0).getDate(); }
  function mondayIndex(y, mIdx, d) { var jsDay = new Date(y, mIdx, d).getDay(); return (jsDay + 6) % 7; }
  function todayIso() { var t = new Date(); return isoDate(t.getFullYear(), t.getMonth(), t.getDate()); }
  var WEEKDAY_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  function formatDateLabel(iso) {
    var d = new Date(iso + "T00:00:00");
    return WEEKDAY_FULL[d.getDay()] + " " + d.getDate() + " " + MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
  }
  function weekdayName(iso) { return WEEKDAY_FULL[new Date(iso + "T00:00:00").getDay()]; }
  function addDaysIso(iso, days) {
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + days);
    return isoDate(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function weeklyDates(firstIso, count) {
    var out = [];
    for (var i = 0; i < count; i++) out.push(addDaysIso(firstIso, i * 7));
    return out;
  }

  /**
   * Renders a month calendar into containerId.
   * cellInfoFn(iso) -> { badge, extraClass, disabled } | null
   * onDateClick(iso)
   * onNav(newYear, newMonth) -- called when prev/next clicked; caller re-renders
   */
  function renderMonthGrid(containerId, year, month, cellInfoFn, onDateClick, onNav, minYear, minMonth) {
    var container = document.getElementById(containerId);
    if (!container) return;
    var lead = mondayIndex(year, month, 1);
    var total = daysInMonth(year, month);
    var cells = [];
    for (var i = 0; i < lead; i++) cells.push(null);
    for (var d = 1; d <= total; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);
    var t = todayIso();
    var atMin = (year < minYear) || (year === minYear && month <= minMonth);

    var html = '<div class="cal-month-head">' +
      '<button class="cal-nav" id="' + containerId + 'Prev" type="button" aria-label="Previous month"' + (atMin ? " disabled" : "") + '>&lsaquo;</button>' +
      "<h3>" + MONTH_NAMES[month] + " " + year + "</h3>" +
      '<button class="cal-nav" id="' + containerId + 'Next" type="button" aria-label="Next month">&rsaquo;</button>' +
    "</div>" +
    '<div class="cal-weekdays">' + WEEKDAY_ABBR.map(function (w) { return "<span>" + w + "</span>"; }).join("") + "</div>" +
    '<div class="cal-month-grid">' +
      cells.map(function (d) {
        if (d === null) return '<div class="cal-cell empty"></div>';
        var iso = isoDate(year, month, d);
        var info = cellInfoFn(iso) || {};
        var classes = "cal-cell" + (iso === t ? " today" : "") + (info.extraClass ? " " + info.extraClass : "");
        return '<button type="button" class="' + classes + '" data-date="' + iso + '"' + (info.disabled ? " disabled" : "") + ">" +
          '<span class="cal-daynum">' + d + "</span>" +
          (info.badge ? '<span class="cal-badge">' + esc(info.badge) + "</span>" : "") +
        "</button>";
      }).join("") +
    "</div>";

    container.innerHTML = html;

    document.getElementById(containerId + "Prev").addEventListener("click", function () {
      var m = month - 1, y = year;
      if (m < 0) { m = 11; y--; }
      onNav(y, m);
    });
    document.getElementById(containerId + "Next").addEventListener("click", function () {
      var m = month + 1, y = year;
      if (m > 11) { m = 0; y++; }
      onNav(y, m);
    });
    Array.prototype.forEach.call(container.querySelectorAll(".cal-cell[data-date]"), function (btn) {
      btn.addEventListener("click", function () { onDateClick(btn.getAttribute("data-date")); });
    });
  }

  // ---------- store abstraction (real HTTP API, same origin) ----------
  var store = window.__PORTAL_TEST_STORE__ || null;

  function getStore() {
    if (store) return Promise.resolve(store);

  // Attaches the session token, JSON-encodes plain-object bodies, and logs the
  // user out on a 401 (expired/invalid token) so a stale session doesn't spin
  // forever on every call. Resolves the parsed JSON body; throws on !ok (with
  // the server's { error } message when present) so callers can .catch().
  function apiFetch(path, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers || {});
    if (state.sessionToken) headers["Authorization"] = "Bearer " + state.sessionToken;
    var body = options.body;
    if (body && !(body instanceof FormData)) {
      headers["Content-Type"] = "application/json";
      body = JSON.stringify(body);
    }
    return fetch(path, Object.assign({}, options, { headers: headers, body: body })).then(function (res) {
      if (res.status === 401) {
        state.user = null; state.sessionToken = null;
        try { sessionStorage.removeItem("passframe_portal_user"); sessionStorage.removeItem("passframe_portal_token"); } catch (e) {}
        renderAll();
      }
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
        return data;
      });
    });
  }

      childName: r.child_name, cohort: r.cohort, date: r.date, start: r.start, end: r.end,

  // Reads a File/Blob into a base64 data: URL, for inline storage (tutor photos) where
  // there's no separate upload step to call first.
  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(reader.error || new Error("Couldn’t read that file.")); };
      reader.readAsDataURL(file);
    });
  }

  function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function isValidLoginId(v) {
    if (isValidEmail(v)) return true;
    return /^[a-z0-9][a-z0-9._-]{2,63}$/.test(v);
  }

  function authModalHtml() {
    return "<h2>PassFrame Portal</h2>" +
      '<label for="liEmail">Email or username</label>' +
      '<input type="text" id="liEmail" autocomplete="username" placeholder="you@example.com">' +
      '<label for="liPin">Password</label>' +
      '<input type="password" id="liPin" autocomplete="current-password" placeholder="Enter your password">' +
      '<button class="btn" id="liGo" style="margin-top:16px;width:100%">Log in</button>' +
      '<div class="msg" id="liMsg"></div>' +
      '<p style="margin-top:16px;font-size:0.82rem;color:var(--muted)">New family? Your tutor sets up your login — ask them for your email and password.</p>';
  }

  function wireAuthModal() {
    document.getElementById("liGo").addEventListener("click", doLogin);
    document.getElementById("liPin").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  }

  function doLogin() {
    var email = document.getElementById("liEmail").value.trim().toLowerCase();
    var password = document.getElementById("liPin").value.trim();
    var msg = document.getElementById("liMsg");
    msg.textContent = ""; msg.className = "msg";
    if (!email || !isValidLoginId(email)) { msg.textContent = "Enter your email or username."; msg.className = "msg error"; return; }
    if (!password) { msg.textContent = "Enter your password."; msg.className = "msg error"; return; }
    // The server checks the password, tracks failed attempts, and handles lockout itself —
    // the client just sends the attempt and shows back whatever it says.
    apiFetch("/api/login", { method: "POST", body: { email: email, password: password } }).then(function (res) {
      state.user = res.user;
      state.sessionToken = res.token;
      try {
        sessionStorage.setItem("passframe_portal_user", JSON.stringify(state.user));
        sessionStorage.setItem("passframe_portal_token", state.sessionToken);
      } catch (e) {}
      closeModal();
      renderAll();
    }).catch(function (err) {
      msg.textContent = err.message || "Couldn’t reach the portal. Try again in a moment.";
      msg.className = "msg error";
    });
  }

  function wireStudentManagement() {
    document.getElementById("stuAdd").addEventListener("click", function () {
      var parent = document.getElementById("stuParent").value.trim();
      var child = document.getElementById("stuChild").value.trim();
      var email = document.getElementById("stuEmail").value.trim().toLowerCase();
      var cohort = document.getElementById("stuCohort").value;
      var board = document.getElementById("stuBoard").value;
      var password = document.getElementById("stuPin").value.trim();
      var msg = document.getElementById("stuMsg");
      msg.textContent = ""; msg.className = "msg";
      if (!parent || !child) { msg.textContent = "Enter both names."; msg.className = "msg error"; return; }
      if (!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)) { msg.textContent = "Enter a valid email."; msg.className = "msg error"; return; }
      if (password.length < 8) { msg.textContent = "Password must be at least 8 characters."; msg.className = "msg error"; return; }
      getStore().then(function (s) {
        return s.createUser({ email: email, password: password, role: "parent", name: parent, childName: child, cohort: cohort, board: board }).then(function () {
          msg.textContent = "Added."; msg.className = "msg ok";
          document.getElementById("stuParent").value = "";
          document.getElementById("stuChild").value = "";
          document.getElementById("stuEmail").value = "";
          document.getElementById("stuPin").value = "";
          loadStudentList();
        });
      }).catch(function (err) { msg.textContent = err.message || "Couldn’t save — check your access."; msg.className = "msg error"; });
    });
  }

  // Every tutor needs resolved student names for their own calendar (e.g. "Aisha Khan (Amir Khan)"
  // on a 1:1 slot), even though only founders see the management UI below.
  function loadStudentsCache() {
    return getStore().then(function (s) { return s ? s.listUsers() : []; }).then(function (all) {
      var families = all.filter(function (u) { return u.role === "parent"; })
        .sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
      tutorStudentsCache = families;
      return families;
    }).catch(function () { tutorStudentsCache = []; return []; });
  }

  function studentLabelByEmail(email) {
    var record = tutorStudentsCache.filter(function (f) { return f.email === email; })[0];
    return record ? (record.childName + " (" + record.name + ")") : email;
  }

  // Every tutor (not just founders) manages their own personal Teams link — it's their own
  // contact info, not an account-management action, so it isn't founder-gated.
  function wireTeamsLink() {
    var input = document.getElementById("teamsLinkInput");
    var btn = document.getElementById("teamsLinkSave");
    if (!input || !btn) return;
    input.value = state.user.teamsLink || "";
    btn.addEventListener("click", function () {
      var msg = document.getElementById("teamsLinkMsg");
      var val = input.value.trim();
      msg.textContent = ""; msg.className = "msg";
      if (val && !/^https?:\/\//i.test(val)) { msg.textContent = "Enter a full link starting with https://"; msg.className = "msg error"; return; }
      getStore().then(function (s) {
        return s.setUser(state.user.email, { teamsLink: val });
      }).then(function () {
        state.user.teamsLink = val;
        try { sessionStorage.setItem("passframe_portal_user", JSON.stringify(state.user)); } catch (e) {}
        msg.textContent = val ? "Saved." : "Removed.";
        msg.className = "msg ok";
      }).catch(function (err) { msg.textContent = err.message || "Couldn’t save — check your access."; msg.className = "msg error"; });
    });
  }

  // Removing a tutor or student never just deletes them — the record moves into the "archive"
  // collection first (with who removed it and when) so founders can still see who used to be
  // active, then the live login is deleted so they can no longer sign in.
  // The server archives (recording who removed it and when) and deletes the login in a
  // single atomic call, so there's no separate archive-then-delete step here anymore.
  function archiveAndDeleteUser(id, userData) {
    return getStore().then(function (s) { return s.deleteUser(id); });
  }

  // Small "Actions ▾" dropdown menus, used wherever a destructive action (removing a tutor or
  // student) shouldn't be a single stray click away. Only one menu-item exists today (Remove),
  // but the pattern leaves room for more without another confirm-dialog rewrite.
  function closeAllActionsMenus() {
    Array.prototype.forEach.call(document.querySelectorAll(".actions-dropdown.show"), function (dd) {
      dd.classList.remove("show");
    });
  }
  document.addEventListener("click", closeAllActionsMenus);

  function wireActionsMenus(scopeEl) {
    Array.prototype.forEach.call(scopeEl.querySelectorAll(".actions-btn"), function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var dd = btn.nextElementSibling;
        var wasOpen = dd.classList.contains("show");
        closeAllActionsMenus();
        if (!wasOpen) dd.classList.add("show");
      });
    });
  }

  function openChangePinModal(id, displayName) {
    openModal(
      "<h3>Change password for " + esc(displayName) + "</h3>" +
      '<p style="color:var(--muted);font-size:0.9rem">Login: <strong>' + esc(id) + "</strong></p>" +

          var email = btn.getAttribute("data-pin-email");

      Array.prototype.forEach.call(el.querySelectorAll("[data-remove-email]"), function (btn) {

          var name = btn.getAttribute("data-remove-name");

  // "Lesson with X in N days" / "No lessons scheduled" — the earliest today-or-later booking.
  function nextLessonLabel(bookings) {
    var t = todayIso();
    var upcoming = bookings.filter(function (b) { return b.date >= t; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (!upcoming.length) return "No lessons scheduled";
    var next = upcoming[0];
    var days = Math.round((new Date(next.date + "T00:00:00") - new Date(t + "T00:00:00")) / 86400000);
    var when = days === 0 ? "today" : days === 1 ? "tomorrow" : "in " + days + " days";
    return "Lesson with " + next.childName + " " + when;
  }

  function drawTutorCalendar() {
    var now = new Date();
    renderMonthGrid("tutorCal", tutorCalYear, tutorCalMonth, function (iso) {
      var lessonsHere = tutorBookingsCache.filter(function (b) { return b.date === iso; });
      var availHere = tutorAvailCache.filter(function (a) { return a.date === iso; });
      var total = lessonsHere.length + availHere.length;
      if (!total) return null;
      var anyCompleted = lessonsHere.some(function (b) { return b.completed; });
      return { badge: String(total), extraClass: anyCompleted ? "has-available" : "has-slots" };
    }, function (iso) {
      renderTutorDateModal(iso);
    }, function (y, m) {
      tutorCalYear = y; tutorCalMonth = m;
      drawTutorCalendar();
    });
    var hoursEl = document.getElementById("tutorMonthHours");
    if (hoursEl) hoursEl.textContent = sumCompletedHoursForMonth(tutorBookingsCache, tutorCalYear, tutorCalMonth).toFixed(1);
    var hoursLabelEl = document.getElementById("tutorMonthHoursLabel");
    if (hoursLabelEl) {
      var isCurrentCalMonth = (tutorCalYear === now.getFullYear() && tutorCalMonth === now.getMonth());
      hoursLabelEl.textContent = isCurrentCalMonth ? "Hours completed this month" :
        "Hours completed in " + MONTH_NAMES[tutorCalMonth] + (tutorCalYear !== now.getFullYear() ? " " + tutorCalYear : "");
    }
    var nextEl = document.getElementById("tutorNextLesson");
    if (nextEl) nextEl.textContent = nextLessonLabel(tutorBookingsCache);
  }

  // ---------- REQUESTS (recurring lesson scheduling, or a one-off session) ----------
  function acceptRequest(req) {
    return getStore().then(function (s) {
      var dates = req.kind === "oneoff" ? [req.firstDate] : weeklyDates(req.firstDate, 4);
      return Promise.all(dates.map(function (d) {
        return s.addBooking({
          requestId: req.id, tutorEmail: req.tutorEmail, parentEmail: req.parentEmail,
          childName: req.childName, cohort: req.cohort, date: d, start: req.start, end: req.end,
          completed: false, createdAt: new Date().toISOString()
        });
      })).then(function () {
        return s.updateRequest(req.id, { status: "accepted", respondedAt: new Date().toISOString() });
      });
    });
  }

  function declineRequest(req) {
    return getStore().then(function (s) { return s.updateRequest(req.id, { status: "declined", respondedAt: new Date().toISOString() }); });
  }

  function withdrawRequest(req) {
    return getStore().then(function (s) { return s.updateRequest(req.id, { status: "withdrawn", respondedAt: new Date().toISOString() }); });
  }

  // Accepted RECURRING requests whose 4-week block has ended or ends within the next 7 days,
  // and that haven't already been renewed with a fresh pending/accepted request. One-off
  // sessions are never renewal candidates — there's nothing left to renew after the one lesson.
  function getRenewalCandidates(allRequests, allBookings, myEmail, roleField) {
    var accepted = allRequests.filter(function (r) { return r.status === "accepted" && r.kind !== "oneoff" && r[roleField] === myEmail; });
    var soonCutoff = addDaysIso(todayIso(), 7);
    var out = [];
    accepted.forEach(function (r) {
      var mine = allBookings.filter(function (b) { return b.requestId === r.id; });
      if (!mine.length) return;
      var lastDate = mine.map(function (b) { return b.date; }).sort().slice(-1)[0];
      if (lastDate > soonCutoff) return;
      var nextFirst = addDaysIso(lastDate, 7);
      var alreadyRenewed = allRequests.some(function (r2) {
        return r2.tutorEmail === r.tutorEmail && r2.parentEmail === r.parentEmail &&
          r2.start === r.start && r2.end === r.end && r2.firstDate === nextFirst &&
          r2.status !== "declined" && r2.status !== "withdrawn";
      });
      if (alreadyRenewed) return;
      out.push({ request: r, lastDate: lastDate, nextFirst: nextFirst });
    });
    return out;
  }

  function requestStatusLabel(status) {
    return status === "pending" ? "Awaiting response" : (status === "accepted" ? "Accepted" : (status === "declined" ? "Declined" : "Withdrawn"));
  }

  // Plain (un-escaped) description of what a request is asking for — callers esc() it themselves.
  function requestScheduleText(r) {
    return r.kind === "oneoff"
      ? "One-off session on " + formatDateLabel(r.firstDate) + ", " + r.start + "–" + r.end
      : "Every " + weekdayName(r.firstDate) + ", " + r.start + "–" + r.end + " · starting " + formatDateLabel(r.firstDate);
  }

  function renderTutorRequests(composeKind) {
    composeKind = composeKind === "oneoff" ? "oneoff" : "recurring";
    var el = document.getElementById("tutorRequests");
    if (!el) return;
    el.innerHTML = '<p class="empty">Loading…</p>';
    Promise.all([
      getStore().then(function (s) { return s ? s.listRequests() : []; }),
      getStore().then(function (s) { return s ? s.listBookings() : []; }),
      getStore().then(function (s) { return s ? s.listUsers() : []; })
    ]).then(function (res) {
      var allRequests = res[0], allBookings = res[1], allUsers = res[2];
      var families = allUsers.filter(function (u) { return u.role === "parent"; })
        .sort(function (a, b) { return (a.childName || "").localeCompare(b.childName || ""); });
      tutorStudentsCache = families;

      var incoming = allRequests.filter(function (r) { return r.tutorEmail === state.user.email && r.direction === "parent-to-tutor" && r.status === "pending"; });
      var sent = allRequests.filter(function (r) { return r.tutorEmail === state.user.email && r.direction === "tutor-to-parent"; })
        .sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
      var renewals = getRenewalCandidates(allRequests, allBookings, state.user.email, "tutorEmail");

      var renewalsHtml = renewals.map(function (x) {
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(x.request.childName) + "</strong>" +
          '<span>Every ' + esc(weekdayName(x.request.firstDate)) + ", " + esc(x.request.start) + "–" + esc(x.request.end) + " · ends " + esc(formatDateLabel(x.lastDate)) + "</span></div>" +
          '<div class="day-slot-actions"><button class="btn small" data-renew-req="' + x.request.id + '">Send renewal request</button></div></div>';
      }).join("");

      var incomingHtml = incoming.length ? incoming.map(function (r) {
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(r.childName) + " (" + esc(cohortLabel(r.cohort)) + ")</strong>" +
          '<span>' + esc(requestScheduleText(r)) + "</span></div>" +
          '<div class="day-slot-actions">' +
            '<button class="btn small" data-accept-req="' + r.id + '">Accept</button>' +
            '<button class="btn danger small" data-decline-req="' + r.id + '">Decline</button>' +
          "</div></div>";
      }).join("") : '<p class="empty">No incoming requests right now.</p>';

      var sentHtml = sent.length ? sent.map(function (r) {
        var withdrawBtn = r.status === "pending" ? '<button class="btn danger small" data-withdraw-req="' + r.id + '">Withdraw</button>' : "";
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(r.childName) + "</strong>" +
          '<span>' + esc(requestScheduleText(r)) + " · " + requestStatusLabel(r.status) + "</span></div>" +

  // ---------- VIEW TUTORS (founder only) ----------
  var viewTutorsList = [], viewTutorEmail = null, viewTutorBookings = [], viewTutorCalYear, viewTutorCalMonth;

  function hoursBetween(start, end) {
    var s = start.split(":").map(Number), e = end.split(":").map(Number);
    return Math.max(0, ((e[0] * 60 + e[1]) - (s[0] * 60 + s[1])) / 60);
  }

  function sumCompletedHoursForMonth(avail, year, month) {
    var monthPrefix = year + "-" + pad2(month + 1) + "-";
    return avail.filter(function (a) { return a.completed && a.date && a.date.indexOf(monthPrefix) === 0; })
      .reduce(function (sum, a) { return sum + hoursBetween(a.start, a.end); }, 0);
  }

  // A resource with no board/yearGroup recorded (any manual upload made before this existed)
  // is treated as common to every board/year, so nothing already uploaded disappears.
  function resourceMatchesBoard(r, board) {
    if (!r.board || r.board === "combined" || board === "combined") return true;
    return r.board === board;
  }
  function resourceMatchesYear(r, year) {
    if (!r.yearGroup || !year) return true;
    return r.yearGroup === year;
  }

  // ---------- SYLLABUS (tutor portal only — static files published alongside this page) ----------
  // Claude's artifact sandbox blocks plain <a href> navigation/new-tab opens to files served
  // from inside the page, so each file gets an Actions menu instead (same pattern as the
  // student/tutor "Remove" menus below): Open previews the PDF in a modal via a blob: URL
  // (no top-level navigation involved), Save goes through the sanctioned "downloads" capability.
  function renderSyllabusList() {
    var listEl = document.getElementById("sylList");
    if (!listEl) return;
    listEl.innerHTML = SYLLABUS_FILES.map(function (f, i) {
      return '<div class="res-item"><div>' + esc(f.title) +
          '<div class="res-meta" id="sylMeta' + i + '">PDF</div>' +
        "</div>" +

          '<div class="actions-dropdown">' +

            '<button class="menu-item" type="button" data-syl-save="' + i + '">Save</button>' +
          "</div>" +
        "</div></div>";
    }).join("");
    wireActionsMenus(listEl);
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-syl-open]"), function (btn) {
      btn.addEventListener("click", function () { closeAllActionsMenus(); openSyllabusFile(Number(btn.getAttribute("data-syl-open"))); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-syl-save]"), function (btn) {
      btn.addEventListener("click", function () { closeAllActionsMenus(); downloadSyllabusFile(Number(btn.getAttribute("data-syl-save"))); });
    });

  // A plain fetch() for a file's bytes, with the session token attached — static worksheet/
  // syllabus PDFs don't need it, but a resource uploaded after launch is served from
  // /api/resources/file/:id, which does require it, and the header is harmless either way.
  function fetchBinary(href) {
    var headers = {};
    if (state.sessionToken) headers["Authorization"] = "Bearer " + state.sessionToken;
    return fetch(href, { headers: headers }).then(function (res) {
      if (!res.ok) throw new Error("fetch failed");
      return res.blob();
    });
  }

  function fetchSyllabusBlob(i) {
    return fetchBinary(SYLLABUS_FILES[i].href);
  }

  function openSyllabusFile(i) {
    var f = SYLLABUS_FILES[i];
    var meta = document.getElementById("sylMeta" + i);
    if (meta) meta.textContent = "Opening…";
    fetchSyllabusBlob(i).then(function (blob) {
      var blobUrl = URL.createObjectURL(blob);
      openModal(
        "<h3>" + esc(f.title) + "</h3>" +
        '<iframe src="' + blobUrl + '" title="' + esc(f.title) + '" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:10px"></iframe>',
        { wide: true }
      );
      if (meta) meta.textContent = "PDF";
    }).catch(function () {
      if (meta) meta.textContent = "Couldn’t open that file here — try Save instead.";
    });
  }

  // Plain browser download — no "downloads" capability here, just a throwaway blob URL
  // and a temporary <a download> click, which every real browser handles as a save.
  function triggerBrowserDownload(blob, filename) {
    var blobUrl = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 4000);
  }

  function downloadSyllabusFile(i) {
    var f = SYLLABUS_FILES[i];
    var meta = document.getElementById("sylMeta" + i);
    if (meta) meta.textContent = "Preparing…";
    fetchSyllabusBlob(i).then(function (blob) {
      triggerBrowserDownload(blob, f.href.split("/").pop());
      if (meta) meta.textContent = "Saved.";
    }).catch(function () {
      if (meta) meta.textContent = "Couldn’t load that file to save it — try again.";
    });
  }

  // Kind -> display label, and a shared blob-preview/download pair, reused by the Resources
  // list below for any resource whose url points at a PDF served alongside this page (our own
  // generated worksheets) rather than an uploaded asset (which already has its own <a href>).
  var WORKSHEET_DOC_LABELS = { lesson: "Lesson Worksheet", homework: "Homework Worksheet", markscheme: "Mark Scheme" };

  function fetchFileBlob(href) {
    return fetchBinary(href);
  }

  // Shared View/Save handlers for any resource-list item (tutor or parent). Same blob-preview +
  // sanctioned-downloads pattern as the syllabus list above. `item` is {title, url}; `metaElId`
  // is the id of that row's small status line, so we can flash "Opening…"/"Saved." next to it.
  function openResourceFile(item, metaElId) {
    var meta = document.getElementById(metaElId);
    var original = meta ? meta.textContent : "";
    if (meta) meta.textContent = "Opening…";
    fetchFileBlob(item.url).then(function (blob) {
      var blobUrl = URL.createObjectURL(blob);
      openModal(
        "<h3>" + esc(item.title) + "</h3>" +
        '<iframe src="' + blobUrl + '" title="' + esc(item.title) + '" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:10px"></iframe>',
        { wide: true }
      );
      if (meta) meta.textContent = original;
    }).catch(function () {
      if (meta) meta.textContent = "Couldn’t open that file here — try Save instead.";
    });
  }

  // Resource URLs come in two shapes (see resources collection): a path-style
  // URL like "worksheets/Maths_Y4Pt2/M01_..._Worksheet.pdf" ends in a real
  // filename, but a blob-style URL like "/_blob/04ebbf7347811289131a1157d3fa6dc1"
  // is a bare asset id with no extension at all. Naming the download from the
  // last URL segment left every blob-style resource (most of the library)
  // with an extensionless filename, which the downloads capability always
  // rejects as "This file type can’t be saved here." — nothing to do with
  // the file itself. Building the filename from the resource's own title
  // (always present, always a PDF) works for both URL shapes.
  function resourceFilename(item) {
    var base = (item.title || "worksheet").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
    return base + ".pdf";
  }

  function downloadResourceFile(item, metaElId) {
    var meta = document.getElementById(metaElId);
    var original = meta ? meta.textContent : "";
    if (meta) meta.textContent = "Preparing…";
    fetchFileBlob(item.url).then(function (blob) {
      triggerBrowserDownload(blob, resourceFilename(item));
      if (meta) meta.textContent = "Saved.";
      setTimeout(function () { if (meta && meta.textContent === "Saved.") meta.textContent = original; }, 1800);
    }).catch(function () {
      var errMsg = "Couldn’t load that file to save it — try again.";
      if (meta) meta.textContent = errMsg;
      setTimeout(function () { if (meta && meta.textContent === errMsg) meta.textContent = original; }, 2600);
    });
  }

  function loadParentCalendarData() {

      getStore().then(function (s) { return s ? s.listUsers() : []; })
    ]).then(function (res) {

  function tutorByEmailForParent(email) {
    return parentTutorsCache.filter(function (t) { return t.email === email; })[0];
  }

  function parentNextLessonLabel(bookings) {
    var t = todayIso();
    var upcoming = bookings.filter(function (b) { return b.date >= t; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (!upcoming.length) return "No lessons scheduled";
    var next = upcoming[0];
    var days = Math.round((new Date(next.date + "T00:00:00") - new Date(t + "T00:00:00")) / 86400000);
    var when = days === 0 ? "today" : days === 1 ? "tomorrow" : "in " + days + " days";
    var tutor = tutorByEmailForParent(next.tutorEmail);
    return "Lesson " + when + " with " + (tutor ? tutor.name : "your tutor");
  }

  function drawParentCalendar() {
    var now = new Date();
    renderMonthGrid("parentCal", parentCalYear, parentCalMonth, function (iso) {

      if (!lessonsHere.length) return null;
      var anyCompleted = lessonsHere.some(function (b) { return b.completed; });
      return { badge: String(lessonsHere.length), extraClass: anyCompleted ? "has-available" : "has-slots" };

      renderParentDateModal(iso);

      parentCalYear = y; parentCalMonth = m;

        .sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
      var renewals = getRenewalCandidates(allRequests, allBookings, state.user.email, "parentEmail");

      var renewalsHtml = renewals.map(function (x) {
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(tutorName(x.request.tutorEmail)) + "</strong>" +

          return s.addRequest({

  // Parents only ever see resources for their own child's year group and exam board — unlike
  // the tutor-side resource browser, there's no board/year tab to switch away from that, just

  function renderParentResourceTabs(activeCat, activeSub) {
    activeCat = activeCat || RES_CATEGORIES[0];
    var hasSub = RES_CATEGORIES_WITH_SUBJECTS.indexOf(activeCat) !== -1;
    activeSub = hasSub ? (activeSub || RES_SUBJECTS[0]) : null;
    var activeBoard = (state.user && state.user.board) || "combined";
    var activeYear = hasSub ? ((state.user && state.user.cohort) || RES_YEARGROUPS[0].id) : null;

    var boardTabsEl = document.getElementById("resBoardTabsP");
    boardTabsEl.innerHTML = '<span class="role-tag small">' + esc(boardLabel(activeBoard)) + "</span>";

    var tabsEl = document.getElementById("resTabsP");
    tabsEl.innerHTML = RES_CATEGORIES.map(function (c) {
      return '<button class="tab-btn" data-catp="' + esc(c) + '" aria-selected="' + (c === activeCat) + '">' + esc(c) + "</button>";
    }).join("");
    Array.prototype.forEach.call(tabsEl.querySelectorAll("[data-catp]"), function (btn) {
      btn.addEventListener("click", function () { renderParentResourceTabs(btn.getAttribute("data-catp"), null); });
    });

    var subTabsEl = document.getElementById("resSubTabsP");
    var yearTabsEl = document.getElementById("resYearTabsP");
    if (hasSub) {
      subTabsEl.style.display = "";
      subTabsEl.innerHTML = RES_SUBJECTS.map(function (s) {
        return '<button class="tab-btn small" data-subp="' + esc(s) + '" aria-selected="' + (s === activeSub) + '">' + esc(s) + "</button>";
      }).join("");
      Array.prototype.forEach.call(subTabsEl.querySelectorAll("[data-subp]"), function (btn) {
        btn.addEventListener("click", function () { renderParentResourceTabs(activeCat, btn.getAttribute("data-subp")); });
      });
      yearTabsEl.style.display = "";
      yearTabsEl.innerHTML = '<span class="role-tag small">' + esc(cohortLabel(activeYear)) + "</span>";
    } else {
      subTabsEl.style.display = "none";
      subTabsEl.innerHTML = "";
      yearTabsEl.style.display = "none";
      yearTabsEl.innerHTML = "";
    }

    var listEl = document.getElementById("resListP");
    listEl.innerHTML = '<p class="empty">Loading…</p>';
    getStore().then(function (s) { return s ? s.listResources() : []; }).then(function (all) {
      var mine = all.filter(function (r) {
        return r.category === activeCat && (activeSub ? r.subject === activeSub : !r.subject) &&
          resourceMatchesBoard(r, activeBoard) && resourceMatchesYear(r, activeYear);
      });
      mine.sort(function (a, b) { return (a.title || "").localeCompare(b.title || "", undefined, { numeric: true }); });
      if (!mine.length) { listEl.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
      listEl.innerHTML = mine.map(function (r, i) {
        return '<div class="res-item"><div>' + esc(r.title) +
          '<div class="res-meta" id="resMetaP' + i + '">Added by ' + esc(r.uploadedBy || "a tutor") + "</div></div>" +
          '<div class="actions-menu"><button class="btn secondary small actions-btn" type="button">Actions ▾</button>' +
            '<div class="actions-dropdown">' +
              '<button class="menu-item" type="button" data-resp-open="' + i + '">View</button>' +
              '<button class="menu-item" type="button" data-resp-save="' + i + '">Save</button>' +
            "</div>" +
          "</div>" +
          "</div>";
      }).join("");
      wireActionsMenus(listEl);
      Array.prototype.forEach.call(listEl.querySelectorAll("[data-resp-open]"), function (btn) {
        var idx = Number(btn.getAttribute("data-resp-open"));
        btn.addEventListener("click", function () { closeAllActionsMenus(); openResourceFile(mine[idx], "resMetaP" + idx); });
      });
      Array.prototype.forEach.call(listEl.querySelectorAll("[data-resp-save]"), function (btn) {
        var idx = Number(btn.getAttribute("data-resp-save"));
        btn.addEventListener("click", function () { closeAllActionsMenus(); downloadResourceFile(mine[idx], "resMetaP" + idx); });
      });
    }).catch(function () { listEl.innerHTML = '<p class="empty">Couldn’t load resources.</p>'; });
  }

  // ---------- boot ----------
  function boot() {
    try {
      var savedUser = sessionStorage.getItem("passframe_portal_user");
      var savedToken = sessionStorage.getItem("passframe_portal_token");
      if (savedUser && savedToken) {
        state.user = JSON.parse(savedUser);
        state.sessionToken = savedToken;
      }
    } catch (e) {}

    renderAll();
  }

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", boot); } else { boot(); }

  window.__PORTAL_APP__ = { state: state, renderAll: renderAll, cohortLabel: cohortLabel };
})();
</script>
</body>
</html>
