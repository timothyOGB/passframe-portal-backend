<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PassFrame Portal</title>
<meta name="description" content="Tutor and parent portal for PassFrame Tuition: availability, booking and lesson resources.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1e1633;
    --muted: #5b5170;
    --wash: #f7f2fd;
    --line: #e5dbf4;
    --brand: #8b2be2;
    --brand-text: #7a1fd0;
    --deep: #4a1290;
    --tint: #d3aef7;
    --on-brand: #ffffff;
    --glow: rgba(139, 43, 226, 0.12);
    --ok: #1a7a4c;
    --ok-wash: #eaf8f1;
    --warn: #b5530a;
    --warn-wash: #fdf2e6;
    --blue: #1d5fc9;
    --blue-wash: #e3edfc;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --text: "Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #130f1f;
      --ink: #f3eefb;
      --muted: #b6abcd;
      --wash: #1b1530;
      --line: #352a50;
      --brand: #9b45ee;
      --brand-text: #c393ff;
      --deep: #7a35d6;
      --tint: #5f3f93;
      --glow: rgba(155, 69, 238, 0.2);
      --ok: #4fd18e;
      --ok-wash: #103524;
      --warn: #f0a15c;
      --warn-wash: #3a2610;
      --blue: #7fb0ff;
      --blue-wash: #17253f;
    }
  }
  /* Same palette as above, but unconditional — this is what lets the toggle force dark mode
     on a device whose OS is set to light (the media-query block above only ever follows the
     OS, modulo data-theme="light" overriding it back to light). */
  :root[data-theme="dark"] {
    --bg: #130f1f;
    --ink: #f3eefb;
    --muted: #b6abcd;
    --wash: #1b1530;
    --line: #352a50;
    --brand: #9b45ee;
    --brand-text: #c393ff;
    --deep: #7a35d6;
    --tint: #5f3f93;
    --glow: rgba(155, 69, 238, 0.2);
    --ok: #4fd18e;
    --ok-wash: #103524;
    --warn: #f0a15c;
    --warn-wash: #3a2610;
    --blue: #7fb0ff;
    --blue-wash: #17253f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    transition: background-color 0.2s ease, color 0.2s ease;
    font-family: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: var(--display); color: var(--ink); margin: 0 0 8px; line-height: 1.15; }
  p { margin: 0 0 12px; }
  a { color: var(--brand-text); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  header.top {
    border-bottom: 1px solid var(--line);
    padding: 18px 0;
    background: var(--wash);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  header.top::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
    background: linear-gradient(90deg, var(--brand), var(--tint), var(--brand)); opacity: 0.85;
  }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand-mark { font-family: var(--display); font-weight: 800; font-size: 1.3rem; color: var(--brand); text-decoration: none; }
  .brand-mark span { display: block; font-size: 0.55rem; letter-spacing: 0.14em; color: var(--brand); font-weight: 600; }
  .header-actions { display: flex; align-items: center; gap: 14px; }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--brand); font-size: 1rem; line-height: 1; cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .theme-toggle:hover { border-color: var(--brand); transform: translateY(-1px) rotate(12deg); }
  .top-actions { display: flex; align-items: center; gap: 14px; }
  .who { font-size: 0.92rem; color: var(--muted); }
  .who strong { color: var(--ink); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--display); font-weight: 700; font-size: 0.92rem;
    padding: 10px 18px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--brand); color: var(--on-brand); text-decoration: none;
  }
  .btn:hover { background: var(--deep); }
  .btn.secondary { background: transparent; color: var(--brand-text); border: 1.5px solid var(--line); }
  .btn.secondary:hover { border-color: var(--brand); }
  .btn.small { padding: 6px 14px; font-size: 0.82rem; }
  .btn.danger { background: transparent; color: #c23b3b; border: 1.5px solid #e8c5c5; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  main { padding: 40px 0 80px; min-height: 60vh; }
  .banner {
    border-radius: 14px; padding: 14px 18px; margin-bottom: 24px;
    font-size: 0.92rem; display: flex; gap: 10px; align-items: flex-start;
  }
  .banner.info { background: var(--wash); color: var(--muted); border: 1px solid var(--line); }
  .banner.warn { background: var(--warn-wash); color: var(--warn); border: 1px solid var(--warn); }
  .banner.ok { background: var(--ok-wash); color: var(--ok); border: 1px solid var(--ok); }
  .card {
    background: var(--wash); border: 1px solid var(--line); border-radius: 18px;
    padding: 24px clamp(18px, 4vw, 32px); margin-bottom: 20px;
  }
  .card h3 { font-size: 1.05rem; }
  .lead-card { max-width: 480px; margin: 28px auto 20px; }
  label { display: block; font-family: var(--display); font-weight: 600; font-size: 0.85rem; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select, textarea {
    width: 100%; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit; font-size: 0.96rem;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
  .tab-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1; padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--muted); font-family: var(--display); font-weight: 700;
    font-size: 0.85rem; cursor: pointer;
  }
  .tab-btn[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .tab-btn.small { flex: none; padding: 6px 12px; font-size: 0.76rem; }
  .preset-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-btn {
    display: inline-block; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--brand-text); font-family: var(--display); font-weight: 700;
    font-size: 0.82rem; cursor: pointer; text-decoration: none;
  }
  .preset-btn:hover { border-color: var(--brand); background: var(--wash); }
  .msg { font-size: 0.88rem; margin-top: 10px; }
  .msg.error { color: #c23b3b; }
  .msg.ok { color: var(--ok); }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex: none;
    background: var(--brand); color: var(--on-brand); display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 700; font-size: 1.3rem;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hello-row { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .hello-row h2 { font-size: 1.5rem; margin-bottom: 2px; }
  .role-tag { display: inline-block; background: var(--tint); color: var(--deep); font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; font-family: var(--display); }
  .role-tag.small { font-size: 0.66rem; padding: 2px 8px; }
  .student-badge { display: inline-block; background: var(--blue-wash); color: var(--blue); font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; font-family: var(--display); }
  .student-badge.small { font-size: 0.66rem; padding: 2px 8px; }
  .hello-row .role-tag, .hello-row .student-badge { margin-left: 2px; }
  .founder-badge { display: inline-block; background: linear-gradient(135deg, #f6d675, #d3a627); color: #4a3300; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; font-family: var(--display); letter-spacing: 0.02em; }
  .hello-row .founder-badge { margin-right: 6px; }
  .empty { color: var(--muted); font-size: 0.9rem; font-style: italic; padding: 10px 0; }
  .empty.state-error { color: #c23b3b; font-style: normal; font-weight: 600; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .empty.state-error { color: #ff8a8a; } }
  :root[data-theme="dark"] .empty.state-error { color: #ff8a8a; }
  /* Skeleton loading rows: a plain rounded bar shape (title + a shorter meta line) with a
     light sweep passing over it, standing in for a resource/booking/request row while its
     real content is still loading. */
  .skeleton-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px;
  }
  .skeleton-bar {
    position: relative; overflow: hidden; border-radius: 6px; background: var(--wash);
  }
  .skeleton-bar::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, var(--glow), transparent);
    animation: skeletonSweep 1.4s ease-in-out infinite;
  }
  @keyframes skeletonSweep { 100% { transform: translateX(100%); } }
  .cat-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .res-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; margin-bottom: 8px;
  }
  .res-item a { font-weight: 600; }
  .res-meta { font-size: 0.78rem; color: var(--muted); }
  .hidden { display: none !important; }
  .review-item {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  }
  .review-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .review-who { font-family: var(--display); font-weight: 700; font-size: 0.88rem; }
  .review-date { color: var(--muted); font-size: 0.76rem; margin-left: auto; }
  .review-stars { color: var(--brand); font-size: 0.95rem; letter-spacing: 1px; }
  .review-text { font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }
  /* Reviews live in a plain, always-open card (not the <details> accordion used elsewhere)
     so they read like a comment section, not something tucked behind a dropdown. */
  .reviews-card { position: relative; overflow: hidden; }
  .reviews-card > *:not(.reviews-watermark) { position: relative; z-index: 1; }
  .reviews-watermark { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .reviews-watermark span {
    position: absolute; font-family: var(--display); font-weight: 700; color: var(--brand);
    opacity: 0.06; animation: floatP 9s ease-in-out infinite;
  }
  @keyframes floatP { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
  .lesson-notes { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }
  .lesson-notes .note-view { background: var(--wash); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }
  .lesson-notes .note-label { display: block; font-family: var(--display); font-weight: 700; font-size: 0.74rem; color: var(--deep); margin-bottom: 2px; }
  .lesson-notes .note-view p { font-size: 0.88rem; line-height: 1.45; white-space: pre-wrap; margin: 0; }
  .lesson-notes textarea { width: 100%; }
  .star-picker { display: flex; gap: 4px; margin: 6px 0 16px; }
  .star-picker button {
    background: none; border: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--line); padding: 2px;
  }
  .star-picker button.on { color: var(--brand); }

  /* Hero (logged out) */
  .landing-view { position: relative; }
  .landing-watermark { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  /* Split in two: .fav-wrap holds the icon's home spot and is what dodges the cursor
     (JS sets its transform, eased by this transition); .fav is the icon itself and only
     ever runs the ambient drift keyframe — two elements so the two transforms never fight
     over the same property. */
  .fav-wrap { position: absolute; transition: transform 0.45s cubic-bezier(.22,1,.36,1); }
  .fav-wrap .fav {
    display: block; width: 100%; height: 100%; border-radius: 22%;
    animation: floatFav 9s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px var(--glow));
  }
  @keyframes floatFav {
    0%   { transform: translate(0, 0) rotate(-5deg); }
    25%  { transform: translate(9px, -17px) rotate(3deg); }
    50%  { transform: translate(-7px, -29px) rotate(-4deg); }
    75%  { transform: translate(-11px, -11px) rotate(4deg); }
    100% { transform: translate(0, 0) rotate(-5deg); }
  }
  .hero-panel {
    text-align: center; max-width: 640px; margin: 28px auto 0; position: relative; overflow: hidden; z-index: 1;
    background: linear-gradient(165deg, var(--wash) 0%, var(--bg) 65%);
    border: 1px solid var(--line); border-radius: 28px;
    padding: clamp(32px, 6vw, 52px) clamp(20px, 5vw, 44px);
    box-shadow: 0 24px 60px -28px var(--glow);
  }
  .hero-panel::before {
    content: ""; position: absolute; width: 280px; height: 280px; border-radius: 50%;
    background: var(--tint); opacity: 0.35; filter: blur(64px); top: -100px; right: -70px; z-index: 0;
  }
  .hero-panel > * { position: relative; z-index: 1; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 6px; background: var(--tint); color: var(--deep);
    font-family: var(--display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 6px 14px; border-radius: 999px; margin-bottom: 14px;
  }
  .hero-panel h1 {
    font-size: clamp(1.9rem, 4.5vw, 2.5rem);
    background: linear-gradient(120deg, var(--deep), var(--brand));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-panel p { color: var(--muted); max-width: 440px; margin-left: auto; margin-right: auto; }
  .hero-panel .btn { margin-top: 12px; padding: 13px 28px; font-size: 1rem; }
  .hero-points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 36px; text-align: left; align-items: start; }
  @media (max-width: 640px) { .hero-points { grid-template-columns: 1fr; } }
  .hero-point {
    position: relative;
    background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px;
    transform: translateY(0) scale(1);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .hero-point:hover {
    transform: translateY(-3px) scale(1);
    border-color: var(--brand);
    box-shadow: 0 10px 24px -14px var(--glow);
  }
  .hero-point.revealed {
    transform: translateY(-3px) scale(1.05);
    z-index: 3;
    box-shadow: 0 20px 40px -18px var(--glow);
  }
  .hero-icon {
    width: 34px; height: 34px; border-radius: 10px; background: var(--wash); color: var(--brand);
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem; margin-bottom: 10px;
  }
  .hero-point strong { display: block; font-family: var(--display); font-size: 0.95rem; margin-bottom: 4px; }
  .hero-point span { font-size: 0.85rem; color: var(--muted); }
  .hero-progress {
    height: 3px; margin-top: 12px; border-radius: 999px; background: var(--line);
    overflow: hidden;
  }
  .hero-progress-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--brand), var(--tint));
    transition: width 0.25s ease;
  }
  .hero-point.charging .hero-progress-fill { width: 100%; transition: width 4s linear; }
  .hero-explainer {
    max-height: 0; opacity: 0; margin-top: 0; overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.35s ease, margin-top 0.4s ease;
  }
  .hero-point.revealed .hero-explainer { max-height: 175px; opacity: 1; margin-top: 14px; }
  /* A tiny looping storyboard — three staged scenes relay one after another, each a little
     mockup of real portal UI (chips, an avatar, a tick), walking through what actually
     happens for that feature rather than a single decorative icon. */
  .hero-stage {
    position: relative; height: 78px;
    background: var(--wash); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .stage-scene {
    position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    align-content: center; gap: 6px; padding: 6px 10px; opacity: 0;
    animation: stageCycle 6s ease-in-out infinite;
  }
  .stage-scene:nth-child(1) { animation-delay: 0s; }
  .stage-scene:nth-child(2) { animation-delay: 2s; }
  .stage-scene:nth-child(3) { animation-delay: 4s; }
  @keyframes stageCycle {
    0% { opacity: 0; transform: translateY(6px); }
    6% { opacity: 1; transform: translateY(0); }
    28% { opacity: 1; transform: translateY(0); }
    35% { opacity: 0; transform: translateY(-6px); }
    100% { opacity: 0; }
  }
  /* Scoped under .hero-stage so these beat the plain ".hero-point span" rule used for the
     card's own description text (a bare ".stage-chip" etc. would otherwise lose that
     specificity fight and silently fall back to its muted color/size). */
  .hero-stage .stage-chip {
    background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 4px 9px; font-size: 0.72rem; font-weight: 700; color: var(--muted); font-family: var(--display);
    white-space: nowrap;
  }
  .hero-stage .stage-chip.active { border-color: var(--brand); color: var(--brand-text); background: var(--tint); }
  .hero-stage .stage-avatar {
    width: 27px; height: 27px; border-radius: 50%; background: var(--brand); color: var(--on-brand);
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800;
    font-family: var(--display); flex: none; box-shadow: 0 2px 6px var(--glow);
  }
  .hero-stage .stage-arrow { color: var(--brand); font-size: 1.15rem; font-weight: 700; flex: none; }
  .hero-stage .stage-check {
    width: 25px; height: 25px; border-radius: 50%; background: var(--ok); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; flex: none;
    box-shadow: 0 2px 6px rgba(26, 122, 76, 0.3);
  }
  .hero-stage .stage-label { font-size: 0.74rem; color: var(--ink); font-weight: 700; font-family: var(--display); white-space: nowrap; }
  .hero-stage .stage-dots { display: flex; align-items: center; gap: 5px; flex: none; }
  .hero-stage .stage-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--brand); flex: none; }
  .hero-explainer p { font-size: 0.8rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20, 12, 36, 0.5); z-index: 90;
    display: none; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto;
  }
  .modal-backdrop.show { display: flex; }
  .modal-card {
    background: var(--bg); border-radius: 20px; padding: clamp(22px, 4vw, 32px);
    max-width: 460px; width: 100%; position: relative; box-shadow: 0 24px 60px rgba(20, 6, 50, 0.3);
  }
  .modal-card.wide { max-width: 640px; }
  .modal-close {
    position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%;
    border: none; background: var(--wash); color: var(--muted); font-size: 1.1rem; cursor: pointer; line-height: 1;
  }
  .modal-close:hover { background: var(--tint); color: var(--deep); }

  /* Month calendar */
  #tutorCal, #parentCal { max-width: 320px; margin: 0 auto; }
  .cal-month-head { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; margin-bottom: 10px; }
  .cal-month-head h3 { margin: 0; font-size: 0.95rem; }
  .cal-nav {
    width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg);
    color: var(--brand-text); font-size: 1rem; cursor: pointer; line-height: 1; flex: none;
  }
  .cal-nav:hover:not(:disabled) { border-color: var(--brand); background: var(--wash); }
  .cal-nav:disabled { opacity: 0.35; cursor: not-allowed; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px; }
  .cal-weekdays span { text-align: center; font-family: var(--display); font-weight: 700; font-size: 0.6rem; color: var(--muted); }

  // ---------- calendar date helpers ----------
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function isoDate(y, mIdx, d) { return y + "-" + pad2(mIdx + 1) + "-" + pad2(d); }
  function daysInMonth(y, mIdx) { return new Date(y, mIdx + 1, 0).getDate(); }
  function mondayIndex(y, mIdx, d) { var jsDay = new Date(y, mIdx, d).getDay(); return (jsDay + 6) % 7; }
  function todayIso() { var t = new Date(); return isoDate(t.getFullYear(), t.getMonth(), t.getDate()); }
  var WEEKDAY_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  function formatDateLabel(iso) {
    var d = new Date(iso + "T00:00:00");
    return WEEKDAY_FULL[d.getDay()] + " " + d.getDate() + " " + MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
  }
  function weekdayName(iso) { return WEEKDAY_FULL[new Date(iso + "T00:00:00").getDay()]; }
  function addDaysIso(iso, days) {
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + days);
    return isoDate(d.getFullYear(), d.getMonth(), d.getDate());
  }

  /**
   * Renders a month calendar into containerId.
   * cellInfoFn(iso) -> { badge, extraClass, disabled } | null
   * onDateClick(iso)
   * onNav(newYear, newMonth) -- called when prev/next clicked; caller re-renders
   */
  function renderMonthGrid(containerId, year, month, cellInfoFn, onDateClick, onNav, minYear, minMonth) {
    var container = document.getElementById(containerId);
    if (!container) return;
    var lead = mondayIndex(year, month, 1);
    var total = daysInMonth(year, month);
    var cells = [];
    for (var i = 0; i < lead; i++) cells.push(null);
    for (var d = 1; d <= total; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);
    var t = todayIso();
    var atMin = (year < minYear) || (year === minYear && month <= minMonth);

    var html = '<div class="cal-month-head">' +
      '<button class="cal-nav" id="' + containerId + 'Prev" type="button" aria-label="Previous month"' + (atMin ? " disabled" : "") + '>&lsaquo;</button>' +
      "<h3>" + MONTH_NAMES[month] + " " + year + "</h3>" +
      '<button class="cal-nav" id="' + containerId + 'Next" type="button" aria-label="Next month">&rsaquo;</button>' +
    "</div>" +
    '<div class="cal-weekdays">' + WEEKDAY_ABBR.map(function (w) { return "<span>" + w + "</span>"; }).join("") + "</div>" +
    '<div class="cal-month-grid">' +
      cells.map(function (d) {
        if (d === null) return '<div class="cal-cell empty"></div>';
        var iso = isoDate(year, month, d);
        var info = cellInfoFn(iso) || {};
        var classes = "cal-cell" + (iso === t ? " today" : "") + (info.extraClass ? " " + info.extraClass : "");
        return '<button type="button" class="' + classes + '" data-date="' + iso + '"' + (info.disabled ? " disabled" : "") + ">" +
          '<span class="cal-daynum">' + d + "</span>" +
          (info.badge ? '<span class="cal-badge">' + esc(info.badge) + "</span>" : "") +
        "</button>";
      }).join("") +
    "</div>";

    container.innerHTML = html;

    document.getElementById(containerId + "Prev").addEventListener("click", function () {
      var m = month - 1, y = year;
      if (m < 0) { m = 11; y--; }
      onNav(y, m);
    });
    document.getElementById(containerId + "Next").addEventListener("click", function () {
      var m = month + 1, y = year;
      if (m > 11) { m = 0; y++; }
      onNav(y, m);
    });
    Array.prototype.forEach.call(container.querySelectorAll(".cal-cell[data-date]"), function (btn) {
      btn.addEventListener("click", function () { onDateClick(btn.getAttribute("data-date")); });
    });
  }

  // Attaches the session token, JSON-encodes plain-object bodies, and logs the
  // user out on a 401 (expired/invalid token) so a stale session doesn't spin
  // forever on every call. Resolves the parsed JSON body; throws on !ok (with
  // the server's { error } message when present) so callers can .catch().
  function apiFetch(path, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers || {});
    if (state.sessionToken) headers["Authorization"] = "Bearer " + state.sessionToken;
    var body = options.body;
    if (body && !(body instanceof FormData)) {
      headers["Content-Type"] = "application/json";
      body = JSON.stringify(body);
    }
    return fetch(path, Object.assign({}, options, { headers: headers, body: body })).then(function (res) {
      if (res.status === 401) {
        state.user = null; state.sessionToken = null;
        try { sessionStorage.removeItem("passframe_portal_user"); sessionStorage.removeItem("passframe_portal_token"); } catch (e) {}
        renderAll();
      }
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
        return data;
      });
    });
  }

  // The backdrop favicons nudge away from the cursor. On every mousemove we read each
  // icon's untransformed "home" position (offsetLeft/offsetTop, unaffected by its own dodge
  // offset — only layout, not transform, feeds those) and push it outward when the pointer
  // is close; moving past or away lets the wrap's own CSS transition ease it back home.
  function wireLandingWatermark() {
    var view = document.querySelector(".landing-view");
    var wraps = document.querySelectorAll(".fav-wrap");
    if (!view || !wraps.length) return;
    var RADIUS = 85, MAX_PUSH = 34;
    var ticking = false, lastX = null, lastY = null;

    function update() {
      ticking = false;
      if (lastX === null) return;
      var viewRect = view.getBoundingClientRect();
      for (var i = 0; i < wraps.length; i++) {
        var w = wraps[i];
        var cx = viewRect.left + w.offsetLeft + w.offsetWidth / 2;
        var cy = viewRect.top + w.offsetTop + w.offsetHeight / 2;
        var dx = cx - lastX, dy = cy - lastY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < RADIUS && dist > 0.01) {
          var push = ((1 - dist / RADIUS) * MAX_PUSH) / dist;
          w.style.transform = "translate(" + (dx * push).toFixed(1) + "px, " + (dy * push).toFixed(1) + "px)";
        } else {
          w.style.transform = "";
        }
      }
    }

    view.addEventListener("mousemove", function (e) {
      lastX = e.clientX; lastY = e.clientY;
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    });
    view.addEventListener("mouseleave", function () {
      lastX = null; lastY = null;
      for (var i = 0; i < wraps.length; i++) wraps[i].style.transform = "";
    });
  }

  }

  // once a minute so the countdown stays roughly accurate while the tab stays open.
  var reminderTickerId = null;
  var REMINDER_WINDOW_MS = 2 * 60 * 60 * 1000;

  function nextUpcomingBooking(bookings) {
    var now = new Date();
    var upcoming = (bookings || []).filter(function (b) {
      return new Date(b.date + "T" + (b.end || b.start)) >= now;
    }).sort(function (a, b) { return (a.date + a.start).localeCompare(b.date + b.start); });
    return upcoming[0] || null;
  }

  function formatCountdown(ms) {
    var mins = Math.round(ms / 60000);
    if (mins <= 1) return "under a minute";
    if (mins < 60) return mins + " minute" + (mins === 1 ? "" : "s");
    var hrs = Math.floor(mins / 60), rem = mins % 60;
    return hrs + "h" + (rem ? " " + rem + "m" : "");
  }

    var joinBtn = teamsLink

      : "";
    return '<div class="reminder-banner"><span>📅 <strong>' + text + "</strong></span>" + joinBtn + "</div>";
  }

  function updateLessonReminderBanner(containerId, booking, opts) {
    var el = document.getElementById(containerId);
    if (!el) return;
    if (!booking) { el.innerHTML = ""; return; }
    opts = opts || {};
    var now = new Date();
    var start = new Date(booking.date + "T" + booking.start);
    var end = new Date(booking.date + "T" + booking.end);
    var withWhom = opts.withLabel ? ", with " + esc(opts.withLabel) : "";
    var timeRange = esc(booking.start) + "–" + esc(booking.end);

    if (now >= start && now <= end) {
      el.innerHTML = reminderBannerHtml("Happening now" + withWhom + " (" + timeRange + ")", opts.teamsLink);
    } else if (start - now > 0 && start - now <= REMINDER_WINDOW_MS) {
      el.innerHTML = reminderBannerHtml("Starting in " + formatCountdown(start - now) + withWhom + " (" + timeRange + ")", opts.teamsLink);
    } else {
      el.innerHTML = "";
    }
  }

  // Clears any previous ticker (so switching dashboards or flipping calendar months
  // never stacks intervals), renders once immediately, then every 60s after that.
  function scheduleReminderTicker(computeAndRender) {
    if (reminderTickerId) clearInterval(reminderTickerId);
    computeAndRender();
    reminderTickerId = setInterval(computeAndRender, 60000);
  }

  // The three hero-point cards play themselves, one at a time, on a loop — no hover, no
  // interaction at all. Each card's progress bar fills over 4 seconds, then it settles into
  // its "revealed" state (slightly bigger, short looping storyboard), holds there so the
  // storyboard has time to play through, then hands off to the next card.
  function wireHeroPoints() {
    var points = document.querySelectorAll(".hero-point");
    if (!points.length) return;
    var CHARGE_MS = 4000;
    var HOLD_MS = 6500;

    function clearAll() {
      for (var i = 0; i < points.length; i++) points[i].classList.remove("charging", "revealed");
    }

    function playFrom(index) {
      clearAll();
      var el = points[index % points.length];
      el.classList.add("charging");
      setTimeout(function () {
        el.classList.add("revealed");
        setTimeout(function () { playFrom(index + 1); }, HOLD_MS);
      }, CHARGE_MS);
    }

    playFrom(0);
  }

      msg.className = "msg";

  }

  function doResetConfirm() {
    var token = document.getElementById("rcToken").value;
    var pass = document.getElementById("rcPass").value;
    var pass2 = document.getElementById("rcPass2").value;
    var msg = document.getElementById("rcMsg");
    msg.textContent = ""; msg.className = "msg";
    if (pass.length < 8) { msg.textContent = "Use at least 8 characters."; msg.className = "msg error"; return; }
    if (pass !== pass2) { msg.textContent = "Those two don’t match."; msg.className = "msg error"; return; }
    var btn = document.getElementById("rcGo");
    btn.disabled = true;
    apiFetch("/api/password-reset/confirm", { method: "POST", body: { token: token, password: pass } }).then(function () {
      msg.textContent = "Password updated — you can log in with it now.";
      msg.className = "msg";
      setTimeout(function () { openModal(authModalHtml()); wireAuthModal(); }, 1400);
    }).catch(function (err) {
      btn.disabled = false;
      msg.textContent = err.message || "That link didn’t work — it may have expired. Request a new one from the login screen.";
      msg.className = "msg error";
    });
  }

  // A reset link lands here as "?resetToken=...". Pop the confirm screen straight
  // away, then strip the token from the URL so refreshing or sharing the link
  // (now spent or soon to expire) doesn't resend it anywhere.
  function checkResetTokenInUrl() {
    try {
      var params = new URLSearchParams(window.location.search);
      var token = params.get("resetToken");
      if (!token) return;
      openModal(resetConfirmHtml(token));
      wireResetConfirm();
      params.delete("resetToken");
      var qs = params.toString();
      window.history.replaceState({}, "", window.location.pathname + (qs ? "?" + qs : "") + window.location.hash);
    } catch (e) {}
  }

  function doLogin() {
    var email = document.getElementById("liEmail").value.trim().toLowerCase();
    var password = document.getElementById("liPin").value.trim();
    var msg = document.getElementById("liMsg");
    msg.textContent = ""; msg.className = "msg";
    if (!email || !isValidLoginId(email)) { msg.textContent = "Enter your email or username."; msg.className = "msg error"; return; }
    if (!password) { msg.textContent = "Enter your password."; msg.className = "msg error"; return; }
    // The server checks the password, tracks failed attempts, and handles lockout itself —
    // the client just sends the attempt and shows back whatever it says.
    apiFetch("/api/login", { method: "POST", body: { email: email, password: password } }).then(function (res) {
      state.user = res.user;
      state.sessionToken = res.token;
      try {
        sessionStorage.setItem("passframe_portal_user", JSON.stringify(state.user));
        sessionStorage.setItem("passframe_portal_token", state.sessionToken);
      } catch (e) {}
      closeModal();
      renderAll();
    }).catch(function (err) {
      msg.textContent = err.message || "Couldn’t reach the portal. Try again in a moment.";
      msg.className = "msg error";
    });
  }

          '<label for="mailTo">To</label>' +

  // Founder-only inbox for the landing page's "Request a consultation" form. A lead
  // starts "new"; marking it contacted or archiving it is just a status update —
  // nothing here creates the actual student login, that's still done by hand above
  // once the founder has been in touch.
  function leadStatusLabel(status) { return status === "contacted" ? "Contacted" : status === "archived" ? "Archived" : "New"; }

  function loadLeadsList() {
    var listEl = document.getElementById("leadsList");
    if (!listEl) return;
    listEl.innerHTML = skeletonListHtml(3);
    getStore().then(function (s) { return s ? s.listLeads() : []; }).then(function (leads) {
      if (!leads.length) { listEl.innerHTML = '<p class="empty">No enquiries yet.</p>'; return; }
      listEl.innerHTML = leads.map(function (l) {
        var details = [
          l.childName ? "for " + esc(l.childName) : null,
          l.cohort ? esc(cohortLabel(l.cohort)) : null,
          l.board ? esc(boardLabel(l.board)) : null,
          l.subject ? esc(l.subject) : null
        ].filter(Boolean).join(" · ");
        var contactLine = esc(l.email) + (l.phone ? " · " + esc(l.phone) : "");
        var msgLine = l.message ? '<div style="margin-top:6px;font-size:0.82rem">' + esc(l.message) + "</div>" : "";
        var actions = l.status === "new"
          ? '<button class="btn small" data-lead-contacted="' + l.id + '">Mark contacted</button><button class="btn secondary small" data-lead-archive="' + l.id + '">Archive</button>'
          : (l.status === "contacted" ? '<button class="btn secondary small" data-lead-archive="' + l.id + '">Archive</button>' : "");
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(l.parentName) + (details ? " (" + details + ")" : "") + "</strong>" +
          '<span>' + contactLine + " · " + leadStatusLabel(l.status) + "</span>" + msgLine +
          "</div>" +
          '<div class="day-slot-actions">' + actions + "</div></div>";
      }).join("");
      Array.prototype.forEach.call(listEl.querySelectorAll("[data-lead-contacted]"), function (btn) {
        btn.addEventListener("click", function () {
          getStore().then(function (s) { return s.updateLeadStatus(btn.getAttribute("data-lead-contacted"), "contacted"); }).then(loadLeadsList);
        });
      });
      Array.prototype.forEach.call(listEl.querySelectorAll("[data-lead-archive]"), function (btn) {
        btn.addEventListener("click", function () {
          getStore().then(function (s) { return s.updateLeadStatus(btn.getAttribute("data-lead-archive"), "archived"); }).then(loadLeadsList);
        });
      });
    }).catch(function () { listEl.innerHTML = errorStateHtml("Couldn’t load enquiries."); });
  }

  // Comment-style feed of every review a family has left, visible only on Timothy's
  // and David's (founder) portals — never to other tutors or other families.
  function loadReviewsList() {
    var listEl = document.getElementById("reviewsList");
    if (!listEl) return;
    listEl.innerHTML = skeletonListHtml(3);
    getStore().then(function (s) { return s.listReviews(); }).then(function (reviews) {
      if (!reviews.length) { listEl.innerHTML = '<p class="empty">No reviews yet.</p>'; return; }
      listEl.innerHTML = reviews.map(function (r) {
        return '<div class="review-item">' +
          '<div class="review-head"><span class="review-who">' + esc(studentLabelByEmail(r.parentEmail)) + "</span>" +
            starsHtml(r.rating) + '<span class="review-date">' + esc(formatReviewDate(r.createdAt)) + "</span></div>" +
          '<div class="review-text">' + esc(r.comment) + "</div>" +
          '<button class="btn danger small" style="margin-top:8px" data-review-remove="' + esc(r.id) + '">Remove</button>' +
        "</div>";
      }).join("");
      Array.prototype.forEach.call(listEl.querySelectorAll("[data-review-remove]"), function (btn) {
        btn.addEventListener("click", function () {
          getStore().then(function (s) { return s.deleteReview(btn.getAttribute("data-review-remove")); }).then(loadReviewsList);
        });
      });
    }).catch(function () { listEl.innerHTML = errorStateHtml("Couldn’t load reviews."); });
  }

  function wireStudentManagement() {
    document.getElementById("stuAdd").addEventListener("click", function () {
      var parent = document.getElementById("stuParent").value.trim();
      var child = document.getElementById("stuChild").value.trim();
      var email = document.getElementById("stuEmail").value.trim().toLowerCase();
      var cohort = document.getElementById("stuCohort").value;
      var board = document.getElementById("stuBoard").value;
      var password = document.getElementById("stuPin").value.trim();
      var msg = document.getElementById("stuMsg");
      msg.textContent = ""; msg.className = "msg";
      if (!parent || !child) { msg.textContent = "Enter both names."; msg.className = "msg error"; return; }
      if (!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)) { msg.textContent = "Enter a valid email."; msg.className = "msg error"; return; }
      if (password.length < 8) { msg.textContent = "Password must be at least 8 characters."; msg.className = "msg error"; return; }
      getStore().then(function (s) {
        return s.createUser({ email: email, password: password, role: "parent", name: parent, childName: child, cohort: cohort, board: board }).then(function () {
          msg.textContent = "Added."; msg.className = "msg ok";
          document.getElementById("stuParent").value = "";
          document.getElementById("stuChild").value = "";
          document.getElementById("stuEmail").value = "";
          document.getElementById("stuPin").value = "";
          loadStudentList();
        });
      }).catch(function (err) { msg.textContent = err.message || "Couldn’t save — check your access."; msg.className = "msg error"; });
    });
  }

  // Every tutor needs resolved student names for their own calendar (e.g. "Aisha Khan (Amir Khan)"
  // on a 1:1 slot), even though only founders see the management UI below.
  function loadStudentsCache() {
    return getStore().then(function (s) { return s ? s.listUsers() : []; }).then(function (all) {
      var families = all.filter(function (u) { return u.role === "parent"; })
        .sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
      tutorStudentsCache = families;
      return families;
    }).catch(function () { tutorStudentsCache = []; return []; });
  }

  function studentLabelByEmail(email) {
    var record = tutorStudentsCache.filter(function (f) { return f.email === email; })[0];
    return record ? (record.childName + " (" + record.name + ")") : email;
  }

  // Every tutor (not just founders) manages their own personal Teams link — it's their own
  // contact info, not an account-management action, so it isn't founder-gated.
  function wireTeamsLink() {
    var input = document.getElementById("teamsLinkInput");
    var btn = document.getElementById("teamsLinkSave");
    if (!input || !btn) return;
    input.value = state.user.teamsLink || "";
    btn.addEventListener("click", function () {
      var msg = document.getElementById("teamsLinkMsg");
      var val = input.value.trim();
      msg.textContent = ""; msg.className = "msg";
      if (val && !/^https?:\/\//i.test(val)) { msg.textContent = "Enter a full link starting with https://"; msg.className = "msg error"; return; }
      getStore().then(function (s) {
        return s.setUser(state.user.email, { teamsLink: val });
      }).then(function () {
        state.user.teamsLink = val;
        try { sessionStorage.setItem("passframe_portal_user", JSON.stringify(state.user)); } catch (e) {}
        msg.textContent = val ? "Saved." : "Removed.";
        msg.className = "msg ok";
      }).catch(function (err) { msg.textContent = err.message || "Couldn’t save — check your access."; msg.className = "msg error"; });
    });
  }

  // Removing a tutor or student never just deletes them — the record moves into the "archive"
  // collection first (with who removed it and when) so founders can still see who used to be
  // active, then the live login is deleted so they can no longer sign in.
  // The server archives (recording who removed it and when) and deletes the login in a
  // single atomic call, so there's no separate archive-then-delete step here anymore.
  function archiveAndDeleteUser(id, userData) {
    return getStore().then(function (s) { return s.deleteUser(id); });
  }

  function refreshAfterRemoval() {
    loadStudentList();
    loadTutorList();
    loadArchiveList();
  }

  // Small "Actions ▾" dropdown menus, used wherever a destructive action (removing a tutor or
  // student) shouldn't be a single stray click away. Only one menu-item exists today (Remove),
  // but the pattern leaves room for more without another confirm-dialog rewrite.
  function closeAllActionsMenus() {
    Array.prototype.forEach.call(document.querySelectorAll(".actions-dropdown.show"), function (dd) {
      dd.classList.remove("show");
    });
  }
  document.addEventListener("click", closeAllActionsMenus);

  function wireActionsMenus(scopeEl) {
    Array.prototype.forEach.call(scopeEl.querySelectorAll(".actions-btn"), function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var dd = btn.nextElementSibling;
        var wasOpen = dd.classList.contains("show");
        closeAllActionsMenus();
        if (!wasOpen) dd.classList.add("show");
      });
    });
  }

  // Replaces window.confirm() for removals: a proper modal naming who's about to be removed,
  // with an explicit Cancel escape hatch.
  function confirmRemoveModal(name, onConfirm) {
    openModal(
      "<h3>Are you sure you want to remove " + esc(name) + "?</h3>" +
      '<p style="color:var(--muted);font-size:0.9rem">They’ll no longer be able to sign in. The account moves to the Archive, where it can be restored later.</p>' +
      '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">' +
        '<button class="btn secondary small" id="confirmRemoveCancel" type="button">Cancel</button>' +
        '<button class="btn danger small" id="confirmRemoveGo" type="button">Remove</button>' +
      "</div>"
    );
    document.getElementById("confirmRemoveCancel").addEventListener("click", closeModal);
    document.getElementById("confirmRemoveGo").addEventListener("click", function () {
      closeModal();
      onConfirm();
    });
  }

  // Lets a founder set a new password for any login — tutor, student, or a founder's own — without
  // needing the old one. Same "load the existing record, overwrite just one field, save it back"
  // pattern as the Teams-link save, so every other field on the account is left untouched.
  function openChangePinModal(id, displayName) {
    openModal(
      "<h3>Change password for " + esc(displayName) + "</h3>" +
      '<p style="color:var(--muted);font-size:0.9rem">Login: <strong>' + esc(id) + "</strong></p>" +
      '<label for="cpNew">New password (min 8 characters)</label>' +
      '<input type="password" id="cpNew" autocomplete="new-password" placeholder="At least 8 characters">' +
      '<label for="cpConfirm">Confirm new password</label>' +
      '<input type="password" id="cpConfirm" autocomplete="new-password" placeholder="At least 8 characters">' +
      '<button class="btn" id="cpGo" style="margin-top:16px;width:100%">Save new password</button>' +
      '<div class="msg" id="cpMsg"></div>'
    );
    document.getElementById("cpGo").addEventListener("click", function () {
      var p1 = document.getElementById("cpNew").value.trim();
      var p2 = document.getElementById("cpConfirm").value.trim();
      var msg = document.getElementById("cpMsg");
      msg.textContent = ""; msg.className = "msg";
      if (p1.length < 8) { msg.textContent = "Password must be at least 8 characters."; msg.className = "msg error"; return; }
      if (p1 !== p2) { msg.textContent = "Passwords don’t match."; msg.className = "msg error"; return; }
      getStore().then(function (s) {
        return s.setPassword(id, p1).then(function () {
          refreshAfterRemoval();
          openPasswordSetConfirmation(id, displayName, p1);
        });
      }).catch(function (err) { msg.textContent = err.message || "Couldn’t save — check your access."; msg.className = "msg error"; });
    });
  }

  // Shows the password right back after a founder sets it — this is not stored anywhere
  // retrievable (it's hashed server-side the moment it's saved), so this screen, showing
  // what was just typed in this same action, is the only point it can ever be read back.
  function openPasswordSetConfirmation(id, displayName, password) {
    openModal(
      "<h3>Password set for " + esc(displayName) + "</h3>" +
      '<p style="color:var(--muted);font-size:0.9rem">Login: <strong>' + esc(id) + "</strong></p>" +
      '<p style="color:var(--muted);font-size:0.85rem">This is shown once, right now — it isn’t stored anywhere you (or anyone) can look it up later. Copy or note it down before closing.</p>' +
      '<div class="credential-box" id="cpRevealBox" style="font-family:monospace;font-size:1.05rem;word-break:break-all;user-select:all">' + esc(password) + "</div>" +
      '<button class="btn secondary" id="cpCopyBtn" style="margin-top:12px;width:100%">Copy password</button>' +
      '<button class="btn" id="cpDoneBtn" style="margin-top:8px;width:100%">Done</button>' +
      '<div class="msg" id="cpCopyMsg"></div>'
    );
    document.getElementById("cpCopyBtn").addEventListener("click", function () {
      var copyMsg = document.getElementById("cpCopyMsg");
      var fallback = function () {
        var box = document.getElementById("cpRevealBox");
        var range = document.createRange();
        range.selectNodeContents(box);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      };
      var done = function () { copyMsg.textContent = "Copied."; copyMsg.className = "msg ok"; };
      var failed = function () { fallback(); copyMsg.textContent = "Couldn’t copy automatically — it’s selected, so Ctrl/Cmd+C will work."; copyMsg.className = "msg error"; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(password).then(done).catch(failed);
      } else {
        failed();
      }
    });
    document.getElementById("cpDoneBtn").addEventListener("click", closeModal);
  }

  // Lets a founder (or a tutor for themselves) replace a tutor's avatar — the only way to fix
  // a photo that never set correctly, or to swap in a new one, now that account creation is
  // the only other place a photo gets set.
  function openUpdatePhotoModal(id, displayName) {
    openModal(
      "<h3>Update photo for " + esc(displayName) + "</h3>" +
      '<label for="upFile">New photo</label>' +
      '<input type="file" id="upFile" accept="image/*">' +
      '<button class="btn" id="upGo" style="margin-top:16px;width:100%">Save photo</button>' +
      '<div class="msg" id="upMsg"></div>'
    );
    document.getElementById("upGo").addEventListener("click", function () {
      var fileInput = document.getElementById("upFile");
      var msg = document.getElementById("upMsg");
      msg.textContent = ""; msg.className = "msg";
      if (!fileInput.files || !fileInput.files[0]) { msg.textContent = "Choose a photo."; msg.className = "msg error"; return; }
      fileToDataUrl(fileInput.files[0]).then(function (photoUrl) {
        return getStore().then(function (s) { return s.setUser(id, { photoDataUrl: photoUrl }); });
      }).then(function () {
        if (state.user && state.user.email === id) {
          state.user.photoDataUrl = null;
          getStore().then(function (s) { return s.getUser(id); }).then(function (u) {
            if (u) { state.user.photoDataUrl = u.photoDataUrl; try { sessionStorage.setItem("passframe_portal_user", JSON.stringify(state.user)); } catch (e) {} }
          });
        }
        closeModal();
        refreshAfterRemoval();
      }).catch(function (err) { msg.textContent = err.message || "Couldn’t save — check your access."; msg.className = "msg error"; });
    });
  }

  function loadStudentList() {
    var el = document.getElementById("stuList");
    if (!el) return;
    el.innerHTML = skeletonListHtml(3);
    loadStudentsCache().then(function (families) {
      if (!families.length) { el.innerHTML = '<p class="empty">No student logins yet.</p>'; return; }
      el.innerHTML = families.map(function (f) {
        var fullName = f.name + " — " + f.childName;
        return '<div class="slot-item"><div class="slot-main"><span class="slot-day">' + esc(f.name) + " — " + esc(f.childName) + ' <span class="student-badge small">Student</span></span>' +
          '<span class="slot-time">' + esc(cohortLabel(f.cohort)) + " · " + esc(boardLabel(f.board)) + '</span>' +
          '<span class="slot-credentials">Login: <strong>' + esc(f.email) + "</strong></span></div>" +
          '<div class="actions-menu"><button class="btn secondary small actions-btn" type="button">Actions ▾</button>' +
            '<div class="actions-dropdown">' +
              '<button class="menu-item" type="button" data-pin-email="' + esc(f.email) + '" data-pin-name="' + esc(fullName) + '">Change password</button>' +
              '<button class="menu-item danger" type="button" data-remove-email="' + esc(f.email) + '" data-remove-name="' + esc(fullName) + '">Remove</button>' +
            "</div>" +
          "</div></div>";
      }).join("");
      wireActionsMenus(el);
      Array.prototype.forEach.call(el.querySelectorAll("[data-pin-email]"), function (btn) {
        btn.addEventListener("click", function () {
          var email = btn.getAttribute("data-pin-email");
          var name = btn.getAttribute("data-pin-name");
          closeAllActionsMenus();
          openChangePinModal(email, name);
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-remove-email]"), function (btn) {
        btn.addEventListener("click", function () {
          var email = btn.getAttribute("data-remove-email");
          var name = btn.getAttribute("data-remove-name");
          var record = tutorStudentsCache.filter(function (f) { return f.email === email; })[0] || {};
          closeAllActionsMenus();
          confirmRemoveModal(name, function () {
            archiveAndDeleteUser(email, record).then(refreshAfterRemoval);
          });
        });
      });
    }).catch(function () { el.innerHTML = errorStateHtml("Couldn’t load student logins."); });
  }

  function wireTutorManagement() {
    var addBtn = document.getElementById("tutAdd");
    if (!addBtn) return;
    var founderCheckbox = document.getElementById("tutFounder");
    if (founderCheckbox) {
      founderCheckbox.addEventListener("change", function () {
        if (!founderCheckbox.checked) return;
        var name = document.getElementById("tutName").value.trim() || "this tutor";
        founderCheckbox.checked = false;
        openModal(
          "<h3>Are you sure you want to give " + esc(name) + " Founder access?</h3>" +
          '<p style="color:var(--muted);font-size:0.9rem">Founder access adds the gold badge and lets them view all tutors’ sessions, email anyone, upload files, and manage tutor and student accounts.</p>' +
          '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">' +
            '<button class="btn secondary small" id="confirmFounderCancel" type="button">Cancel</button>' +
            '<button class="btn small" id="confirmFounderGo" type="button">Give Founder access</button>' +
          "</div>"
        );
        document.getElementById("confirmFounderCancel").addEventListener("click", closeModal);
        document.getElementById("confirmFounderGo").addEventListener("click", function () {
          founderCheckbox.checked = true;
          closeModal();
        });
      });
    }
    addBtn.addEventListener("click", function () {
      var name = document.getElementById("tutName").value.trim();
      var id = document.getElementById("tutId").value.trim().toLowerCase();
      var password = document.getElementById("tutPin").value.trim();
      var isFounderNew = document.getElementById("tutFounder").checked;
      var fileInput = document.getElementById("tutPhoto");
      var linkedinUrl = document.getElementById("tutLinkedin").value.trim();
      var msg = document.getElementById("tutMsg");
      msg.textContent = ""; msg.className = "msg";
      if (!name) { msg.textContent = "Enter the tutor’s name."; msg.className = "msg error"; return; }
      if (!id || !isValidLoginId(id)) { msg.textContent = "Enter a valid email or username (letters/numbers, 3+ characters)."; msg.className = "msg error"; return; }
      if (password.length < 8) { msg.textContent = "Password must be at least 8 characters."; msg.className = "msg error"; return; }
      if (linkedinUrl && !/^https?:\/\//i.test(linkedinUrl)) { msg.textContent = "LinkedIn link should start with http:// or https://."; msg.className = "msg error"; return; }
      addBtn.disabled = true;
      var hasFile = fileInput.files && fileInput.files[0];
      // No more "assets" capability to upload a photo to — just read it straight into a
      // data URL in-browser and send it as a plain string; the backend's photoDataUrl
      // field already accepts any data URL.
      var photoPromise = hasFile ? fileToDataUrl(fileInput.files[0]).catch(function () { return null; }) : Promise.resolve(null);
      photoPromise.then(function (photoUrl) {
        var data = { email: id, password: password, role: "tutor", name: name };
        if (isFounderNew) data.isFounder = true;
        if (photoUrl) data.photoDataUrl = photoUrl;
        if (linkedinUrl) data.linkedinUrl = linkedinUrl;
        return getStore().then(function (s) { return s.createUser(data); });
      }).then(function () {
        msg.textContent = "Tutor login added."; msg.className = "msg ok";
        document.getElementById("tutName").value = "";
        document.getElementById("tutId").value = "";
        document.getElementById("tutPin").value = "";
        document.getElementById("tutLinkedin").value = "";
        document.getElementById("tutFounder").checked = false;
        fileInput.value = "";
        loadTutorList();
      }).catch(function (err) { msg.textContent = err.message || "Couldn’t save — check your access."; msg.className = "msg error"; })
        .then(function () { addBtn.disabled = false; });
    });
  }

  function loadTutorList() {
    var el = document.getElementById("tutList");
    if (!el) return;
    el.innerHTML = skeletonListHtml(3);
    getStore().then(function (s) { return s ? s.listUsers() : []; }).then(function (all) {
      var tutors = all.filter(function (u) { return u.role === "tutor"; })
        .sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
      if (!tutors.length) { el.innerHTML = '<p class="empty">No tutor logins yet.</p>'; return; }
      el.innerHTML = tutors.map(function (t) {
        var isSelf = t.email === state.user.email;
        return '<div class="slot-item"><div class="tutor-row">' +
          '<div class="tutor-row-avatar">' + (t.photoDataUrl ? '<img src="' + esc(t.photoDataUrl) + '" alt="">' : esc((t.name || "?")[0])) + "</div>" +
          '<div class="slot-main"><span class="slot-day">' + esc(t.name) + " " + (t.isFounder ? '<span class="founder-badge small">Founder</span>' : '<span class="role-tag small">Tutor</span>') + (isSelf ? " (you)" : "") + "</span>" +
          '<span class="slot-credentials">Login: <strong>' + esc(t.email) + "</strong>" + (t.linkedinUrl ? ' · <a href="' + esc(t.linkedinUrl) + '" target="_blank" rel="noopener">LinkedIn</a>' : "") + "</span></div></div>" +
          '<div class="actions-menu"><button class="btn secondary small actions-btn" type="button">Actions ▾</button>' +
            '<div class="actions-dropdown">' +
              '<button class="menu-item" type="button" data-pin-tutor="' + esc(t.email) + '" data-pin-name="' + esc(t.name) + (isSelf ? " (you)" : "") + '">Change password</button>' +
              '<button class="menu-item" type="button" data-photo-tutor="' + esc(t.email) + '" data-photo-name="' + esc(t.name) + (isSelf ? " (you)" : "") + '">Update photo</button>' +
              ((isSelf || t.isFounder) ? "" : '<button class="menu-item danger" type="button" data-remove-tutor="' + esc(t.email) + '" data-remove-name="' + esc(t.name) + '">Remove</button>') +
            "</div>" +
          "</div>" +
        "</div>";
      }).join("");
      wireActionsMenus(el);
      Array.prototype.forEach.call(el.querySelectorAll("[data-pin-tutor]"), function (btn) {
        btn.addEventListener("click", function () {
          var email = btn.getAttribute("data-pin-tutor");
          var name = btn.getAttribute("data-pin-name");
          closeAllActionsMenus();
          openChangePinModal(email, name);
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-photo-tutor]"), function (btn) {
        btn.addEventListener("click", function () {
          var email = btn.getAttribute("data-photo-tutor");
          var name = btn.getAttribute("data-photo-name");
          closeAllActionsMenus();
          openUpdatePhotoModal(email, name);
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-remove-tutor]"), function (btn) {
        btn.addEventListener("click", function () {
          var email = btn.getAttribute("data-remove-tutor");
          var name = btn.getAttribute("data-remove-name");

            archiveAndDeleteUser(email, record).then(refreshAfterRemoval);

  function loadArchiveList() {
    var el = document.getElementById("archiveList");
    if (!el) return;
    el.innerHTML = skeletonListHtml(3);
    getStore().then(function (s) { return s ? s.listArchive() : []; }).then(function (all) {
      var rows = all.slice().sort(function (a, b) {
        return (b.archivedAt || "").localeCompare(a.archivedAt || "");
      });
      if (!rows.length) { el.innerHTML = '<p class="empty">Nothing archived yet — removed tutors and students will show up here.</p>'; return; }
      el.innerHTML = rows.map(function (r) {
        var roleBadge = r.role === "tutor"

          : '<span class="student-badge small">Student</span>';
        var who = r.role === "tutor" ? esc(r.name) : esc(r.name) + " — " + esc(r.childName);
        var archivedWhen = r.archivedAt ? new Date(r.archivedAt).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "unknown date";
        return '<div class="slot-item"><div class="slot-main"><span class="slot-day">' + who + " " + roleBadge + "</span>" +
          '<span class="slot-credentials">Login: <strong>' + esc(r.id) + "</strong></span>" +
          '<span class="slot-time">Removed ' + esc(archivedWhen) + (r.archivedBy ? " by " + esc(r.archivedBy) : "") + "</span></div>" +
          '<button class="btn secondary small" data-restore-id="' + esc(r.id) + '">Restore</button></div>';
      }).join("");
      Array.prototype.forEach.call(el.querySelectorAll("[data-restore-id]"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-restore-id");
          // The server checks for a live-login conflict and does the restore atomically.
          getStore().then(function (s) { return s.restoreArchive(id); }).then(refreshAfterRemoval).catch(function (err) {
            window.alert(err.message || ("A login already exists for “" + id + "”. Remove or rename it before restoring this one."));
          });
        });

  function wireTutorEmailTool() {
    var btn = document.getElementById("mailSend");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var to = document.getElementById("mailTo").value.trim();
      var subject = document.getElementById("mailSubject").value.trim();
      var body = document.getElementById("mailBody").value;
      var msg = document.getElementById("mailMsg");
      msg.textContent = ""; msg.className = "msg";
      if (!to || !/^[^@]+@[^@]+\.[^@]+$/.test(to)) { msg.textContent = "Enter a valid recipient email."; msg.className = "msg error"; return; }
      window.location.href = mailtoHref(to, subject, body, PASSFRAME_INBOX);
      msg.textContent = "Opening your email app…"; msg.className = "msg ok";
    });
