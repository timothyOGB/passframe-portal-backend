  function loadTutorCalendarData() {
    return Promise.all([
      getStore().then(function (s) { return s ? s.listBookings() : []; }),
      getStore().then(function (s) { return s ? s.listAvailability() : []; })
    ]).then(function (res) {
      tutorBookingsCache = res[0].filter(function (b) { return b.tutorEmail === state.user.email; });
      tutorAvailCache = res[1].filter(function (a) { return a.tutorEmail === state.user.email; });
    });
  }

  // "Lesson with X in N days" / "No lessons scheduled" — the earliest today-or-later booking.
  function nextLessonLabel(bookings) {
    var t = todayIso();
    var upcoming = bookings.filter(function (b) { return b.date >= t; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (!upcoming.length) return "No lessons scheduled";
    var next = upcoming[0];
    var days = Math.round((new Date(next.date + "T00:00:00") - new Date(t + "T00:00:00")) / 86400000);
    var when = days === 0 ? "today" : days === 1 ? "tomorrow" : "in " + days + " days";
    return "Lesson with " + next.childName + " " + when;
  }

  function drawTutorCalendar() {
    var now = new Date();
    renderMonthGrid("tutorCal", tutorCalYear, tutorCalMonth, function (iso) {
      var lessonsHere = tutorBookingsCache.filter(function (b) { return b.date === iso; });
      var availHere = tutorAvailCache.filter(function (a) { return a.date === iso; });
      var total = lessonsHere.length + availHere.length;
      if (!total) return null;
      var anyCompleted = lessonsHere.some(function (b) { return b.completed; });
      return { badge: String(total), extraClass: anyCompleted ? "has-available" : "has-slots" };
    }, function (iso) {
      renderTutorDateModal(iso);
    }, function (y, m) {
      tutorCalYear = y; tutorCalMonth = m;
      drawTutorCalendar();
    });
    var hoursEl = document.getElementById("tutorMonthHours");
    if (hoursEl) hoursEl.textContent = sumCompletedHoursForMonth(tutorBookingsCache, tutorCalYear, tutorCalMonth).toFixed(1);
    var hoursLabelEl = document.getElementById("tutorMonthHoursLabel");
    if (hoursLabelEl) {
      var isCurrentCalMonth = (tutorCalYear === now.getFullYear() && tutorCalMonth === now.getMonth());
      hoursLabelEl.textContent = isCurrentCalMonth ? "Hours completed this month" :
        "Hours completed in " + MONTH_NAMES[tutorCalMonth] + (tutorCalYear !== now.getFullYear() ? " " + tutorCalYear : "");
    }
    var nextEl = document.getElementById("tutorNextLesson");
    if (nextEl) nextEl.textContent = nextLessonLabel(tutorBookingsCache);

    scheduleReminderTicker(function () {
      var nextBooking = nextUpcomingBooking(tutorBookingsCache);
      updateLessonReminderBanner("lessonReminder", nextBooking, {
        withLabel: nextBooking ? nextBooking.childName : "",
        teamsLink: state.user.teamsLink || null
      });
    });
  }

  function renderTutorDateModal(iso) {
    var lessons = tutorBookingsCache.filter(function (b) { return b.date === iso; }).sort(function (a, b) { return a.start.localeCompare(b.start); });
    var lessonsHtml = lessons.length ? lessons.map(function (b) {
      var joinBtn = state.user.teamsLink
        ? '<a class="btn secondary small" href="' + esc(state.user.teamsLink) + '" target="_blank" rel="noopener">Join Teams call</a>'
        : "";
      return '<div class="day-slot-item' + (b.completed ? " completed" : "") + '">' +
        '<div class="day-slot-main"><strong>' + esc(b.start) + "–" + esc(b.end) + "</strong>" +
        '<span>' + esc(b.childName) + " · " + esc(cohortLabel(b.cohort)) + "</span></div>" +
        '<div class="day-slot-actions">' +
          joinBtn +
          '<label class="slot-complete"><input type="checkbox" data-tb-complete-id="' + b.id + '"' + (b.completed ? " checked" : "") + '> Completed</label>' +
          '<button class="btn danger small" data-tb-cancel-id="' + b.id + '">Cancel this week</button>' +
        "</div>" +
        '<div class="lesson-notes">' +
          (b.noteForTutor ? '<div class="note-view"><span class="note-label">Note from ' + esc(b.childName || "the family") + "’s portal</span><p>" + esc(b.noteForTutor) + "</p></div>" : "") +
          '<label for="noteStu' + b.id + '">Notes for student/parent</label>' +
          '<textarea id="noteStu' + b.id + '" rows="2" placeholder="Anything they should know before or after this lesson?">' + esc(b.noteForStudent) + "</textarea>" +
          '<button class="btn secondary small" data-tb-note-id="' + b.id + '" style="margin-top:6px">Save note</button>' +
          '<span class="msg" id="noteStuMsg' + b.id + '"></span>' +
        "</div>" +
      "</div>";
    }).join("") : '<p class="empty">No lessons booked for this date.</p>';

    function renderAvailHtml() {
      var avail = tutorAvailCache.filter(function (a) { return a.date === iso; }).sort(function (a, b) { return a.start.localeCompare(b.start); });
      return avail.length ? avail.map(function (a) {
        var who = a.studentEmail ? ("Marked as available for " + studentLabelByEmail(a.studentEmail)) : "Marked as available for anyone";
        return '<div class="day-slot-item">' +
          '<div class="day-slot-main"><strong>' + esc(a.start) + "–" + esc(a.end) + "</strong>" +
          "<span>" + esc(who) + "</span></div>" +
          '<div class="day-slot-actions">' +
            '<button class="btn danger small" data-tb-avail-remove="' + a.id + '">Remove</button>' +
          "</div>" +
        "</div>";
      }).join("") : '<p class="empty">No availability marked for this date — use the form above to add some.</p>';
    }

    function wireAvailRemoveButtons() {
      Array.prototype.forEach.call(document.querySelectorAll("[data-tb-avail-remove]"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-tb-avail-remove");
          getStore().then(function (s) { return s.deleteAvailability(id); })
            .then(loadTutorCalendarData)
            .then(function () { drawTutorCalendar(); renderTutorDateModal(iso); });
        });
      });
    }

    openModal(
      "<h2>" + esc(formatDateLabel(iso)) + "</h2>" +
      "<h3 style=\"margin-top:0;font-size:0.95rem\">Lessons</h3>" +
      '<div class="day-slot-list" id="tutorDayLessons">' + lessonsHtml + "</div>" +
      "<h3 style=\"margin-top:20px;font-size:0.95rem\">Your availability</h3>" +
      '<p style="color:var(--muted);font-size:0.85rem;margin-top:-8px">A note for planning — marking a time available doesn\'t book or notify anyone. Add as many slots as you like for this date, open to anyone or reserved for one family.</p>' +
      '<div class="day-slot-list" id="tutorDayAvail">' + renderAvailHtml() + "</div>" +
      '<label for="availStudent">Reserve for (optional)</label>' +
      '<select id="availStudent"><option value="">Anyone — open slot</option></select>' +
      '<div class="field-row">' +
        '<div><label for="availStart">Start time</label><input type="time" id="availStart" value="16:00"></div>' +
        '<div><label for="availEnd">End time</label><input type="time" id="availEnd" value="17:00"></div>' +
      "</div>" +
      '<button class="btn" id="availAdd" style="margin-top:16px;width:100%">Add availability</button>' +
      '<div class="msg" id="availMsg"></div>'
    );

    wireAvailRemoveButtons();

    loadStudentsCache().then(function (families) {
      var sel = document.getElementById("availStudent");
      if (sel) {
        sel.innerHTML = '<option value="">Anyone — open slot</option>' + families.map(function (f) {
          return '<option value="' + esc(f.email) + '">' + esc(f.childName) + " (" + esc(f.name) + ")</option>";
        }).join("");
      }
      // Re-render the availability list now that studentLabelByEmail has family names to work with.
      var availList = document.getElementById("tutorDayAvail");
      if (availList) {
        availList.innerHTML = renderAvailHtml();
        wireAvailRemoveButtons();
      }
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-tb-complete-id]"), function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-tb-complete-id");
        getStore().then(function (s) { return s.updateBooking(id, { completed: cb.checked }); })
          .then(loadTutorCalendarData)
          .then(function () { drawTutorCalendar(); renderTutorDateModal(iso); });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-tb-cancel-id]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-tb-cancel-id");
        getStore().then(function (s) { return s.deleteBooking(id); })
          .then(loadTutorCalendarData)
          .then(function () { drawTutorCalendar(); renderTutorDateModal(iso); });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-tb-note-id]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-tb-note-id");
        var ta = document.getElementById("noteStu" + id);
        var msg = document.getElementById("noteStuMsg" + id);
        getStore().then(function (s) { return s.updateBooking(id, { noteForStudent: ta.value.trim() }); })
          .then(loadTutorCalendarData)
          .then(function () { drawTutorCalendar(); renderTutorDateModal(iso); })
          .catch(function () { if (msg) { msg.textContent = "Couldn’t save — try again."; msg.className = "msg error"; } });
      });
    });

    document.getElementById("availAdd").addEventListener("click", function () {
      var start = document.getElementById("availStart").value;
      var end = document.getElementById("availEnd").value;
      var studentEmail = document.getElementById("availStudent").value;
      var msg = document.getElementById("availMsg");
      msg.textContent = ""; msg.className = "msg";
      if (!start || !end || start >= end) { msg.textContent = "Check the start and end time."; msg.className = "msg error"; return; }
      getStore().then(function (s) {
        if (!s) { msg.textContent = "Storage unavailable right now."; msg.className = "msg error"; return; }
        var data = { tutorEmail: state.user.email, date: iso, start: start, end: end };
        if (studentEmail) data.studentEmail = studentEmail;
        return s.addAvailability(data);
      }).then(function () { return loadTutorCalendarData(); }).then(function () {
        drawTutorCalendar();
        renderTutorDateModal(iso);
      }).catch(function () { msg.textContent = "Couldn’t save — check your access."; msg.className = "msg error"; });
    });
  }

  // ---------- REQUESTS (recurring lesson scheduling, or a one-off session) ----------
  function acceptRequest(req) {
    return getStore().then(function (s) {
      var dates = req.kind === "oneoff" ? [req.firstDate] : weeklyDates(req.firstDate, 4);
      return Promise.all(dates.map(function (d) {
        return s.addBooking({
          requestId: req.id, tutorEmail: req.tutorEmail, parentEmail: req.parentEmail,
          childName: req.childName, cohort: req.cohort, date: d, start: req.start, end: req.end,
          completed: false, createdAt: new Date().toISOString()
        });
      })).then(function () {
        return s.updateRequest(req.id, { status: "accepted", respondedAt: new Date().toISOString() });
      });
    });
  }

  function declineRequest(req) {
    return getStore().then(function (s) { return s.updateRequest(req.id, { status: "declined", respondedAt: new Date().toISOString() }); });
  }

  function withdrawRequest(req) {
    return getStore().then(function (s) { return s.updateRequest(req.id, { status: "withdrawn", respondedAt: new Date().toISOString() }); });
  }

  // Accepted RECURRING requests whose 4-week block has ended or ends within the next 7 days,
  // and that haven't already been renewed with a fresh pending/accepted request. One-off
  // sessions are never renewal candidates — there's nothing left to renew after the one lesson.
  function getRenewalCandidates(allRequests, allBookings, myEmail, roleField) {
    var accepted = allRequests.filter(function (r) { return r.status === "accepted" && r.kind !== "oneoff" && r[roleField] === myEmail; });
    var soonCutoff = addDaysIso(todayIso(), 7);
    var out = [];
    accepted.forEach(function (r) {
      var mine = allBookings.filter(function (b) { return b.requestId === r.id; });
      if (!mine.length) return;
      var lastDate = mine.map(function (b) { return b.date; }).sort().slice(-1)[0];
      if (lastDate > soonCutoff) return;
      var nextFirst = addDaysIso(lastDate, 7);
      var alreadyRenewed = allRequests.some(function (r2) {
        return r2.tutorEmail === r.tutorEmail && r2.parentEmail === r.parentEmail &&
          r2.start === r.start && r2.end === r.end && r2.firstDate === nextFirst &&
          r2.status !== "declined" && r2.status !== "withdrawn";
      });
      if (alreadyRenewed) return;
      out.push({ request: r, lastDate: lastDate, nextFirst: nextFirst });
    });
    return out;
  }

  function requestStatusLabel(status) {
    return status === "pending" ? "Awaiting response" : (status === "accepted" ? "Accepted" : (status === "declined" ? "Declined" : "Withdrawn"));
  }

  // Plain (un-escaped) description of what a request is asking for — callers esc() it themselves.
  function requestScheduleText(r) {
    return r.kind === "oneoff"
      ? "One-off session on " + formatDateLabel(r.firstDate) + ", " + r.start + "–" + r.end
      : "Every " + weekdayName(r.firstDate) + ", " + r.start + "–" + r.end + " · starting " + formatDateLabel(r.firstDate);
  }

  // Does the tutor have marked availability that covers this request's time? Availability
  // is per-date, so for a recurring request this only ever checks the first lesson date —
  // still useful as a quick sanity check, just noted as such in the badge text below.
  function timeRangesOverlap(aStart, aEnd, bStart, bEnd) { return aStart < bEnd && bStart < aEnd; }

  function matchingAvailabilityFor(allAvailability, r) {
    return allAvailability.filter(function (a) {
      return a.tutorEmail === state.user.email && a.date === r.firstDate &&
        (!a.studentEmail || a.studentEmail === r.parentEmail) &&
        timeRangesOverlap(a.start, a.end, r.start, r.end);
    });
  }

  function availabilityBadgeHtml(allAvailability, r) {
    var matches = matchingAvailabilityFor(allAvailability, r);
    var dateNote = r.kind === "recurring" ? " on the first date" : "";
    if (matches.length) {
      var times = matches.map(function (m) { return esc(m.start) + "–" + esc(m.end); }).join(", ");
      return '<div class="avail-badge-row"><span class="avail-badge yes">✓ You’re marked free' + dateNote + " (" + times + ")</span></div>";
    }
    return '<div class="avail-badge-row"><span class="avail-badge no">No marked availability' + dateNote + " — check your calendar</span></div>";
  }

  function renderTutorRequests(composeKind) {
    composeKind = composeKind === "oneoff" ? "oneoff" : "recurring";
    var el = document.getElementById("tutorRequests");
    if (!el) return;
    el.innerHTML = skeletonListHtml(3);
    Promise.all([
      getStore().then(function (s) { return s ? s.listRequests() : []; }),
      getStore().then(function (s) { return s ? s.listBookings() : []; }),
      getStore().then(function (s) { return s ? s.listUsers() : []; }),
      getStore().then(function (s) { return s ? s.listAvailability() : []; })
    ]).then(function (res) {
      var allRequests = res[0], allBookings = res[1], allUsers = res[2], allAvailability = res[3];
      var families = allUsers.filter(function (u) { return u.role === "parent"; })
        .sort(function (a, b) { return (a.childName || "").localeCompare(b.childName || ""); });
      tutorStudentsCache = families;

      var incoming = allRequests.filter(function (r) { return r.tutorEmail === state.user.email && r.direction === "parent-to-tutor" && r.status === "pending"; });
      var sent = allRequests.filter(function (r) { return r.tutorEmail === state.user.email && r.direction === "tutor-to-parent"; })
        .sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
      var renewals = getRenewalCandidates(allRequests, allBookings, state.user.email, "tutorEmail");

      var renewalsHtml = renewals.map(function (x) {
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(x.request.childName) + "</strong>" +
          '<span>Every ' + esc(weekdayName(x.request.firstDate)) + ", " + esc(x.request.start) + "–" + esc(x.request.end) + " · ends " + esc(formatDateLabel(x.lastDate)) + "</span></div>" +
          '<div class="day-slot-actions"><button class="btn small" data-renew-req="' + x.request.id + '">Send renewal request</button></div></div>';
      }).join("");

      var incomingHtml = incoming.length ? incoming.map(function (r) {
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(r.childName) + " (" + esc(cohortLabel(r.cohort)) + ")</strong>" +
          '<span>' + esc(requestScheduleText(r)) + "</span>" +
          availabilityBadgeHtml(allAvailability, r) +
          "</div>" +
          '<div class="day-slot-actions">' +
            '<button class="btn small" data-accept-req="' + r.id + '">Accept</button>' +
            '<button class="btn danger small" data-decline-req="' + r.id + '">Decline</button>' +
          "</div></div>";
      }).join("") : '<p class="empty">No incoming requests right now.</p>';

      var sentHtml = sent.length ? sent.map(function (r) {
        var withdrawBtn = r.status === "pending" ? '<button class="btn danger small" data-withdraw-req="' + r.id + '">Withdraw</button>' : "";
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(r.childName) + "</strong>" +
          '<span>' + esc(requestScheduleText(r)) + " · " + requestStatusLabel(r.status) + "</span></div>" +
          '<div class="day-slot-actions">' + withdrawBtn + "</div></div>";
      }).join("") : '<p class="empty">You haven’t sent any requests yet — use the form below to send a one-off or recurring request to a parent.</p>';

      var dateLabel = composeKind === "oneoff" ? "Session date" : "First lesson date";

      el.innerHTML =
        (renewals.length ? ('<h4 style="font-size:0.9rem;margin:0 0 8px">Ending soon</h4><div class="day-slot-list">' + renewalsHtml + "</div>") : "") +
        '<h4 style="font-size:0.9rem;margin:16px 0 8px">Incoming requests</h4>' +
        '<div class="day-slot-list">' + incomingHtml + "</div>" +
        '<h4 style="font-size:0.9rem;margin:20px 0 8px">Send a new request</h4>' +
        '<p style="color:var(--muted);font-size:0.85rem;margin-top:-6px">Need to cover a missed lesson or add an extra session this week? Use "One-off session" for a single date instead of a 4-week block.</p>' +
        '<div class="cat-tabs" style="margin-bottom:2px">' +
          '<button type="button" class="tab-btn small" data-reqkind="recurring" aria-selected="' + (composeKind === "recurring") + '">Recurring (4 weeks)</button>' +
          '<button type="button" class="tab-btn small" data-reqkind="oneoff" aria-selected="' + (composeKind === "oneoff") + '">One-off session</button>' +
        "</div>" +
        '<label for="reqFamily">Family</label>' +
        '<select id="reqFamily">' + (families.length ? families.map(function (f) {
          return '<option value="' + esc(f.email) + '">' + esc(f.childName) + " (" + esc(f.name) + ") · " + esc(cohortLabel(f.cohort)) + "</option>";
        }).join("") : '<option value="">No student logins yet</option>') + "</select>" +
        '<label for="reqFirstDate">' + dateLabel + "</label>" +
        '<input type="date" id="reqFirstDate">' +
        '<div class="field-row">' +
          '<div><label for="reqStart">Start time</label><input type="time" id="reqStart" value="16:00"></div>' +
          '<div><label for="reqEnd">End time</label><input type="time" id="reqEnd" value="17:00"></div>' +
        "</div>" +
        '<button class="btn" id="reqSend" style="margin-top:16px;width:100%">Send request</button>' +
        '<div class="msg" id="reqMsg"></div>' +
        '<h4 style="font-size:0.9rem;margin:20px 0 8px">Your sent requests</h4>' +
        '<div class="day-slot-list">' + sentHtml + "</div>";

      Array.prototype.forEach.call(el.querySelectorAll("[data-reqkind]"), function (btn) {
        btn.addEventListener("click", function () { renderTutorRequests(btn.getAttribute("data-reqkind")); });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-accept-req]"), function (btn) {
        btn.addEventListener("click", function () {
          var r = allRequests.filter(function (x) { return x.id === btn.getAttribute("data-accept-req"); })[0];
          if (!r) return;
          acceptRequest(r).then(function () { renderTutorRequests(composeKind); loadTutorCalendarData().then(drawTutorCalendar); });
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-decline-req]"), function (btn) {
        btn.addEventListener("click", function () {
          var r = allRequests.filter(function (x) { return x.id === btn.getAttribute("data-decline-req"); })[0];
          if (!r) return;
          declineRequest(r).then(function () { renderTutorRequests(composeKind); });
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-withdraw-req]"), function (btn) {
        btn.addEventListener("click", function () {
          var r = allRequests.filter(function (x) { return x.id === btn.getAttribute("data-withdraw-req"); })[0];
          if (!r) return;
          withdrawRequest(r).then(function () { renderTutorRequests(composeKind); });
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-renew-req]"), function (btn) {
        btn.addEventListener("click", function () {
          var x = renewals.filter(function (y) { return y.request.id === btn.getAttribute("data-renew-req"); })[0];
          if (!x) return;
          var r = x.request;
          getStore().then(function (s) {
            return s.addRequest({
              direction: "tutor-to-parent", tutorEmail: r.tutorEmail, parentEmail: r.parentEmail,
              childName: r.childName, cohort: r.cohort, kind: "recurring", firstDate: x.nextFirst, start: r.start, end: r.end,
              status: "pending", createdAt: new Date().toISOString(), renewalOf: r.id
            });
          }).then(function () { renderTutorRequests(composeKind); });
        });
      });

      document.getElementById("reqSend").addEventListener("click", function () {
        var msg = document.getElementById("reqMsg");
        msg.textContent = ""; msg.className = "msg";
        var parentEmail = document.getElementById("reqFamily").value;
        var firstDate = document.getElementById("reqFirstDate").value;
        var start = document.getElementById("reqStart").value;
        var end = document.getElementById("reqEnd").value;
        if (!parentEmail) { msg.textContent = "Pick a family first."; msg.className = "msg error"; return; }
        if (!firstDate) { msg.textContent = "Pick a date."; msg.className = "msg error"; return; }
        if (!start || !end || start >= end) { msg.textContent = "Check the start and end time."; msg.className = "msg error"; return; }
        var family = families.filter(function (f) { return f.email === parentEmail; })[0];
        if (!family) { msg.textContent = "That family login couldn’t be found."; msg.className = "msg error"; return; }
        getStore().then(function (s) {
          if (!s) { msg.textContent = "Storage unavailable right now."; msg.className = "msg error"; return; }
          return s.addRequest({
            direction: "tutor-to-parent", tutorEmail: state.user.email, parentEmail: parentEmail,
            childName: family.childName, cohort: family.cohort, kind: composeKind, firstDate: firstDate, start: start, end: end,
            status: "pending", createdAt: new Date().toISOString()
          });
        }).then(function () { renderTutorRequests(composeKind); }).catch(function () { msg.textContent = "Couldn’t send — check your access."; msg.className = "msg error"; });
      });
    }).catch(function () { el.innerHTML = errorStateHtml("Couldn’t load requests."); });
  }

  // ---------- VIEW TUTORS (founder only) ----------
  var viewTutorsList = [], viewTutorEmail = null, viewTutorBookings = [], viewTutorCalYear, viewTutorCalMonth;

  function hoursBetween(start, end) {
    var s = start.split(":").map(Number), e = end.split(":").map(Number);
    return Math.max(0, ((e[0] * 60 + e[1]) - (s[0] * 60 + s[1])) / 60);
  }

  function sumCompletedHoursForMonth(avail, year, month) {
    var monthPrefix = year + "-" + pad2(month + 1) + "-";
    return avail.filter(function (a) { return a.completed && a.date && a.date.indexOf(monthPrefix) === 0; })
      .reduce(function (sum, a) { return sum + hoursBetween(a.start, a.end); }, 0);
  }

  function openViewTutorsModal() {
    openModal("<h2>View tutors</h2><p class=\"empty\">Loading tutors…</p>", { wide: true });
    getStore().then(function (s) { return s ? s.listUsers() : []; }).then(function (all) {
      viewTutorsList = all.filter(function (u) { return u.role === "tutor"; })
        .sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
      renderViewTutorsPicker();
    });
  }

  function renderViewTutorsPicker() {
    var pickerHtml = '<div class="tutor-picker">' +
      viewTutorsList.map(function (t) {
        return '<button type="button" class="tutor-pick-btn" data-view-tutor="' + esc(t.email) + '" aria-selected="' + (t.email === viewTutorEmail) + '">' +
          '<span class="tutor-pick-avatar">' + (t.photoDataUrl ? '<img src="' + t.photoDataUrl + '" alt="">' : esc((t.name || "?")[0])) + "</span>" +
          esc(t.name) +
        "</button>";
      }).join("") +
    "</div>";

    openModal(
      "<h2>View tutors</h2>" +
      (viewTutorsList.length ? pickerHtml : '<p class="empty">No tutor accounts yet.</p>') +
      '<div id="viewTutorBody"></div>',
      { wide: true }
    );
    wireTutorPicker();
    if (viewTutorEmail) loadAndRenderViewTutorCalendar();
  }

  function wireTutorPicker() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-view-tutor]"), function (btn) {
      btn.addEventListener("click", function () {
        viewTutorEmail = btn.getAttribute("data-view-tutor");
        var now = new Date();
        viewTutorCalYear = now.getFullYear();
        viewTutorCalMonth = now.getMonth();
        renderViewTutorsPicker();
      });
    });
  }

  function fetchViewTutorData() {
    return getStore().then(function (s) { return s ? s.listBookings() : []; }).then(function (all) {
      viewTutorBookings = all.filter(function (b) { return b.tutorEmail === viewTutorEmail; });
    });
  }

  function loadAndRenderViewTutorCalendar() {
    var body = document.getElementById("viewTutorBody");
    if (body) body.innerHTML = skeletonListHtml(2);
    return fetchViewTutorData().then(renderViewTutorCalendarBody).catch(function () {
      if (body) body.innerHTML = errorStateHtml("Couldn’t load this tutor’s calendar.");
    });
  }

  function renderViewTutorCalendarBody() {
    var body = document.getElementById("viewTutorBody");
    if (!body) return;
    var monthPrefix = viewTutorCalYear + "-" + pad2(viewTutorCalMonth + 1);
    var monthLabel = MONTH_NAMES[viewTutorCalMonth] + " " + viewTutorCalYear;
    var completedThisMonth = viewTutorBookings.filter(function (b) {
      return b.completed && b.date && b.date.indexOf(monthPrefix + "-") === 0;
    });
    var totalHours = sumCompletedHoursForMonth(viewTutorBookings, viewTutorCalYear, viewTutorCalMonth);
    var studentEmails = {};
    completedThisMonth.forEach(function (b) { studentEmails[b.parentEmail] = true; });
    var studentCount = Object.keys(studentEmails).length;
    var tutor = viewTutorsList.filter(function (t) { return t.email === viewTutorEmail; })[0] || {};

    body.innerHTML =
      '<div class="credential-box">Login: <strong>' + esc(tutor.email || viewTutorEmail) + "</strong>" +
        (tutor.linkedinUrl ? ' · <a href="' + esc(tutor.linkedinUrl) + '" target="_blank" rel="noopener">LinkedIn</a>' : "") +
      "</div>" +
      '<div class="cal-with-sidebar">' +
        '<div id="viewTutorCal" class="cal-main"></div>' +
        '<div class="cal-sidebar">' +
          '<div class="stat-tile"><strong>' + totalHours.toFixed(1) + "</strong><span>Hours completed in " + esc(MONTH_NAMES[viewTutorCalMonth]) + "</span></div>" +
          '<div class="stat-tile"><strong>' + studentCount + "</strong><span>Students tutored in " + esc(MONTH_NAMES[viewTutorCalMonth]) + "</span></div>" +
        "</div>" +
      "</div>" +
      '<p style="color:var(--muted);font-size:0.9rem">Showing <strong>' + esc(monthLabel) + '</strong> — the totals at the side update as you move between months. Click a date to see who was tutored and whether the lesson was marked complete.</p>';

    renderMonthGrid("viewTutorCal", viewTutorCalYear, viewTutorCalMonth, function (iso) {
      var n = viewTutorBookings.filter(function (b) { return b.date === iso; }).length;
      if (!n) return null;
      var anyCompleted = viewTutorBookings.some(function (b) { return b.date === iso && b.completed; });
      return { badge: String(n), extraClass: anyCompleted ? "has-available" : "has-slots" };
    }, function (iso) {
      renderViewTutorDateDetail(iso);
    }, function (y, m) {
      viewTutorCalYear = y; viewTutorCalMonth = m;
      renderViewTutorCalendarBody();
    });
  }

  function renderViewTutorDateDetail(iso) {
    var tutor = viewTutorsList.filter(function (t) { return t.email === viewTutorEmail; })[0] || {};
    var lessons = viewTutorBookings.filter(function (b) { return b.date === iso; }).sort(function (a, b) { return a.start.localeCompare(b.start); });
    var listHtml = lessons.length ? lessons.map(function (b) {
      return '<div class="day-slot-item' + (b.completed ? " completed" : "") + '">' +
        '<div class="day-slot-main"><strong>' + esc(b.start) + "–" + esc(b.end) + "</strong>" +
        '<span>' + esc(b.childName) + "</span></div>" +
        '<div class="day-slot-actions">' +
          '<label class="slot-complete"><input type="checkbox" data-audit-complete-id="' + b.id + '"' + (b.completed ? " checked" : "") + '> Completed</label>' +
        "</div>" +
      "</div>";
    }).join("") : '<p class="empty">No lessons booked for this date.</p>';

    openModal(
      '<button type="button" class="back-link" id="backToViewTutorCal">&lsaquo; Back to calendar</button>' +
      "<h2>" + esc(tutor.name || "Tutor") + " — " + esc(formatDateLabel(iso)) + "</h2>" +
      '<div class="day-slot-list">' + listHtml + "</div>",
      { wide: true }
    );

    document.getElementById("backToViewTutorCal").addEventListener("click", function () {
      renderViewTutorsPicker();
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-audit-complete-id]"), function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-audit-complete-id");
        getStore().then(function (s) { return s.updateBooking(id, { completed: cb.checked }); })
          .then(fetchViewTutorData)
          .then(function () { renderViewTutorDateDetail(iso); });
      });
    });
  }

  // A resource with no board/yearGroup recorded (any manual upload made before this existed)
  // is treated as common to every board/year, so nothing already uploaded disappears.
  function resourceMatchesBoard(r, board) {
    if (!r.board || r.board === "combined" || board === "combined") return true;
    return r.board === board;
  }
  function resourceMatchesYear(r, year) {
    if (!r.yearGroup || !year) return true;
    return r.yearGroup === year;
  }

  function renderResourceTabs(activeBoard, activeCat, activeSub, activeYear) {
    activeBoard = activeBoard || "combined";
    activeCat = activeCat || RES_CATEGORIES[0];
    var hasSub = RES_CATEGORIES_WITH_SUBJECTS.indexOf(activeCat) !== -1;
    activeSub = hasSub ? (activeSub || RES_SUBJECTS[0]) : null;
    activeYear = hasSub ? (activeYear || RES_YEARGROUPS[0].id) : null;

    var searchWrap = document.getElementById("resSearchWrap");
    searchWrap.innerHTML = '<input type="search" id="resSearch" placeholder="Search resources by title…">';
    wireResourceSearch("resSearch", "resList", "resMeta", true,
      function () { return loadResourceList(activeBoard, activeCat, activeSub, activeYear); });

    var boardTabsEl = document.getElementById("resBoardTabs");
    boardTabsEl.innerHTML = BOARDS.map(function (b) {
      return '<button class="tab-btn" data-board="' + esc(b.id) + '" aria-selected="' + (b.id === activeBoard) + '">' + esc(b.label) + "</button>";
    }).join("");
    Array.prototype.forEach.call(boardTabsEl.querySelectorAll("[data-board]"), function (btn) {
      btn.addEventListener("click", function () { renderResourceTabs(btn.getAttribute("data-board"), activeCat, activeSub, activeYear); });
    });

    var tabsEl = document.getElementById("resTabs");
    tabsEl.innerHTML = RES_CATEGORIES.map(function (c) {
      return '<button class="tab-btn" data-cat="' + esc(c) + '" aria-selected="' + (c === activeCat) + '">' + esc(c) + "</button>";
    }).join("");
    Array.prototype.forEach.call(tabsEl.querySelectorAll("[data-cat]"), function (btn) {
      btn.addEventListener("click", function () { renderResourceTabs(activeBoard, btn.getAttribute("data-cat"), null, null); });
    });

    var subTabsEl = document.getElementById("resSubTabs");
    var yearTabsEl = document.getElementById("resYearTabs");
    if (hasSub) {
      subTabsEl.style.display = "";
      subTabsEl.innerHTML = RES_SUBJECTS.map(function (s) {
        return '<button class="tab-btn small" data-sub="' + esc(s) + '" aria-selected="' + (s === activeSub) + '">' + esc(s) + "</button>";
      }).join("");
      Array.prototype.forEach.call(subTabsEl.querySelectorAll("[data-sub]"), function (btn) {
        btn.addEventListener("click", function () { renderResourceTabs(activeBoard, activeCat, btn.getAttribute("data-sub"), activeYear); });
      });
      yearTabsEl.style.display = "";
      yearTabsEl.innerHTML = RES_YEARGROUPS.map(function (y) {
        return '<button class="tab-btn small" data-year="' + esc(y.id) + '" aria-selected="' + (y.id === activeYear) + '">' + esc(y.label) + "</button>";
      }).join("");
      Array.prototype.forEach.call(yearTabsEl.querySelectorAll("[data-year]"), function (btn) {
        btn.addEventListener("click", function () { renderResourceTabs(activeBoard, activeCat, activeSub, btn.getAttribute("data-year")); });
      });
    } else {
      subTabsEl.style.display = "none";
      subTabsEl.innerHTML = "";
      yearTabsEl.style.display = "none";
      yearTabsEl.innerHTML = "";
    }

    var uploadArea = document.getElementById("resUploadArea");
    var uploadLabel = hasSub ? (activeCat + " — " + activeSub + " — " + cohortLabel(activeYear)) : activeCat;
    if (state.user && state.user.isFounder) {
      uploadArea.innerHTML =
        '<label for="resTitle">Title</label>' +
        '<input type="text" id="resTitle" placeholder="e.g. VR practice set 3 — answers">' +
        (hasSub ? ('<label for="resBoard">Board</label>' +
          '<select id="resBoard">' + BOARDS.map(function (b) { return '<option value="' + b.id + '">' + b.label + "</option>"; }).join("") + "</select>") : "") +
        '<label for="resFile">File</label>' +
        '<input type="file" id="resFile">' +
        '<button class="btn small" id="resUpload" style="margin-top:12px">Upload to ' + esc(uploadLabel) + "</button>" +
        '<div class="msg" id="resMsg"></div>';
      var boardSelectForUpload = document.getElementById("resBoard");
      if (boardSelectForUpload) boardSelectForUpload.value = activeBoard === "combined" ? "combined" : activeBoard;

      document.getElementById("resUpload").addEventListener("click", function () {
        var title = document.getElementById("resTitle").value.trim();
        var fileInput = document.getElementById("resFile");
        var msg = document.getElementById("resMsg");
        var uploadBoard = boardSelectForUpload ? boardSelectForUpload.value : null;
        msg.textContent = ""; msg.className = "msg";
        if (!title) { msg.textContent = "Give it a title."; msg.className = "msg error"; return; }
        if (!fileInput.files || !fileInput.files[0]) { msg.textContent = "Choose a file."; msg.className = "msg error"; return; }
        var formData = new FormData();
        formData.append("file", fileInput.files[0]);
        formData.append("title", title);
        formData.append("category", activeCat);
        if (activeSub) formData.append("subject", activeSub);
        if (hasSub && uploadBoard) formData.append("board", uploadBoard);
        if (hasSub) formData.append("yearGroup", activeYear);
        getStore().then(function (s) { return s.addResource(formData); })
          .then(function () { msg.textContent = "Uploaded."; msg.className = "msg ok"; loadResourceList(activeBoard, activeCat, activeSub, activeYear); })
          .catch(function (err) { msg.textContent = err.message || "Upload failed — check your access."; msg.className = "msg error"; });
      });
    } else {
      uploadArea.innerHTML = '<p class="empty">Only Timothy and David can add resources here. You can view and download everything below.</p>';
    }

    loadResourceList(activeBoard, activeCat, activeSub, activeYear);
  }

  // Shared by the tab-filtered list and the search results below (both tutor and parent
  // views): renders resource rows into listEl and wires their View/Save/Remove buttons.
  // idPrefix keeps the per-row meta-text element ids distinct between the tutor list
  // ("resMeta0"), the parent list ("resMetaP0") and parent search results.
  function renderResourceItems(listEl, items, idPrefix, allowRemove, reloadFn) {
    if (!items.length) { listEl.innerHTML = '<p class="empty">Nothing found.</p>'; return; }
    listEl.innerHTML = items.map(function (r, i) {
      return '<div class="res-item"><div>' + esc(r.title) +
        '<div class="res-meta" id="' + idPrefix + i + '">Added by ' + esc(r.uploadedBy || "a tutor") + "</div></div>" +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<div class="actions-menu"><button class="btn secondary small actions-btn" type="button">Actions ▾</button>' +
            '<div class="actions-dropdown">' +
              '<button class="menu-item" type="button" data-res-open="' + i + '">View</button>' +
              '<button class="menu-item" type="button" data-res-save="' + i + '">Save</button>' +
            "</div>" +
          "</div>" +
          (allowRemove && state.user && state.user.isFounder ? '<button class="btn danger small" data-rid="' + r.id + '">Remove</button>' : "") +
        "</div>" +
        "</div>";
    }).join("");
    wireActionsMenus(listEl);
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-res-open]"), function (btn) {
      var idx = Number(btn.getAttribute("data-res-open"));
      btn.addEventListener("click", function () { closeAllActionsMenus(); openResourceFile(items[idx], idPrefix + idx); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-res-save]"), function (btn) {
      var idx = Number(btn.getAttribute("data-res-save"));
      btn.addEventListener("click", function () { closeAllActionsMenus(); downloadResourceFile(items[idx], idPrefix + idx); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-rid]"), function (btn) {
      btn.addEventListener("click", function () {
        getStore().then(function (s) { return s.deleteResource(btn.getAttribute("data-rid")); }).then(reloadFn);
      });
    });
  }

  // Wires a title search box that, while it has text, replaces the tab-filtered list with
  // matches from every resource (not just the active tab) — so you don't have to know which
  // board/category/year something lives under to find it. Clearing it restores the normal
  // tab-filtered view via normalReloadFn.
  function wireResourceSearch(inputId, listElId, idPrefix, allowRemove, normalReloadFn) {
    var input = document.getElementById(inputId);
    if (!input) return;
    var debounceTimer = null;

    function runSearch() {
      var q = input.value.trim();
      var listEl = document.getElementById(listElId);
      if (!listEl) return;
      if (!q) { normalReloadFn(); return; }
      listEl.innerHTML = skeletonListHtml(3);
      getStore().then(function (s) { return s ? s.listResources() : []; }).then(function (all) {
        var ql = q.toLowerCase();
        var matches = all.filter(function (r) { return (r.title || "").toLowerCase().indexOf(ql) !== -1; });
        matches.sort(function (a, b) { return (a.title || "").localeCompare(b.title || "", undefined, { numeric: true }); });
        renderResourceItems(listEl, matches, idPrefix, allowRemove, runSearch);
      }).catch(function () { listEl.innerHTML = errorStateHtml("Couldn’t search resources."); });
    }

    input.addEventListener("input", function () {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(runSearch, 180);
    });
  }

  function loadResourceList(board, cat, sub, year) {
    var listEl = document.getElementById("resList");
    if (!listEl) return;
    listEl.innerHTML = skeletonListHtml(3);
    getStore().then(function (s) { return s ? s.listResources() : []; }).then(function (all) {
      var mine = all.filter(function (r) {
        return r.category === cat && (sub ? r.subject === sub : !r.subject) &&
          resourceMatchesBoard(r, board) && resourceMatchesYear(r, year);
      });
      mine.sort(function (a, b) { return (a.title || "").localeCompare(b.title || "", undefined, { numeric: true }); });
      if (!mine.length) {
        listEl.innerHTML = '<p class="empty">Nothing here yet — try a different tab, search by title above' +
          (state.user && state.user.isFounder ? ", or add one with the uploader above." : ".") + "</p>";
        return;
      }
      renderResourceItems(listEl, mine, "resMeta", true, function () { loadResourceList(board, cat, sub, year); });
    }).catch(function () { listEl.innerHTML = errorStateHtml("Couldn’t load resources."); });
  }

  // ---------- SYLLABUS (founder-managed resources, category "Syllabus", board-scoped) ----------
  // Shared across the tutor and parent dashboards: same markup both places, same DOM ids
  // (sylBoardTabs/sylUploadArea/sylList), rendered by renderSyllabusSection() below. Founders
  // get an upload box and a Remove button per file (same pattern as the worksheet library's
  // renderResourceTabs/loadResourceList); everyone else gets a view/download-only list.
  function syllabusCardHtml(locked) {
    var desc = locked
      ? "The week-by-week teaching syllabus for " + esc((state.user && state.user.childName) || "your child") + "’s course — " + esc(boardLabel((state.user && state.user.board) || "combined")) + ", Year 4, Year 4 Pt 2 and Year 5 Accelerated as it applies to them."
      : "The full week-by-week teaching syllabus — Kent, Bexley, and the combined Kent &amp; Bexley track — each covering Year 4, Year 4 Pt 2, and Year 5 Accelerated.";
    return '<p style="color:var(--muted);font-size:0.9rem">' + desc + "</p>" +
      '<div class="cat-tabs" id="sylBoardTabs"></div>' +
      '<div id="sylUploadArea" style="margin-top:12px"></div>' +
      '<div id="sylList" style="margin-top:12px"></div>';
  }

  // `locked` (true on the parent/student dashboard) pins the board to the student's own
  // exam board and shows it as a plain label rather than a switchable tab — they should
  // only ever see the syllabus for their own child, not browse every board's syllabus.
  function renderSyllabusSection(activeBoard, locked) {
    activeBoard = activeBoard || "combined";
    var boardTabsEl = document.getElementById("sylBoardTabs");
    if (!boardTabsEl) return;
    if (locked) {
      boardTabsEl.innerHTML = '<span class="role-tag small">' + esc(boardLabel(activeBoard)) + "</span>";
    } else {
      boardTabsEl.innerHTML = BOARDS.map(function (b) {
        return '<button class="tab-btn" data-syl-board="' + esc(b.id) + '" aria-selected="' + (b.id === activeBoard) + '">' + esc(b.label) + "</button>";
      }).join("");
      Array.prototype.forEach.call(boardTabsEl.querySelectorAll("[data-syl-board]"), function (btn) {
        btn.addEventListener("click", function () { renderSyllabusSection(btn.getAttribute("data-syl-board"), locked); });
      });
    }

    var uploadArea = document.getElementById("sylUploadArea");
    if (state.user && state.user.isFounder) {
      uploadArea.innerHTML =
        '<label for="sylTitle">Title</label>' +
        '<input type="text" id="sylTitle" placeholder="e.g. Kent Syllabus 2027/28">' +
        '<label for="sylBoard">Board</label>' +
        '<select id="sylBoard">' + BOARDS.map(function (b) { return '<option value="' + b.id + '">' + b.label + "</option>"; }).join("") + "</select>" +
        '<label for="sylFile">File</label>' +
        '<input type="file" id="sylFile" accept="application/pdf">' +
        '<button class="btn small" id="sylUpload" style="margin-top:12px">Upload syllabus</button>' +
        '<div class="msg" id="sylUploadMsg"></div>';
      document.getElementById("sylBoard").value = activeBoard;
      document.getElementById("sylUpload").addEventListener("click", function () {
        var title = document.getElementById("sylTitle").value.trim();
        var fileInput = document.getElementById("sylFile");
        var board = document.getElementById("sylBoard").value;

  // A plain fetch() for a file's bytes, with the session token attached — static worksheet/
  // syllabus PDFs don't need it, but a resource uploaded after launch is served from
  // /api/resources/file/:id, which does require it, and the header is harmless either way.
  function fetchBinary(href) {
    var headers = {};
    if (state.sessionToken) headers["Authorization"] = "Bearer " + state.sessionToken;
    return fetch(href, { headers: headers }).then(function (res) {
      if (!res.ok) throw new Error("fetch failed");
      return res.blob();
    });
  }

  // Plain browser download — no "downloads" capability here, just a throwaway blob URL
  // and a temporary <a download> click, which every real browser handles as a save.
  function triggerBrowserDownload(blob, filename) {
    var blobUrl = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 4000);
  }

  // Kind -> display label, and a shared blob-preview/download pair, reused by the Resources
  // list below for any resource whose url points at a PDF served alongside this page (our own
  // generated worksheets) rather than an uploaded asset (which already has its own <a href>).
  var WORKSHEET_DOC_LABELS = { lesson: "Lesson Worksheet", homework: "Homework Worksheet", markscheme: "Mark Scheme" };

  function fetchFileBlob(href) {
    return fetchBinary(href);
  }

  // Shared View/Save handlers for any resource-list item (tutor or parent). Same blob-preview +
  // sanctioned-downloads pattern as the syllabus list above. `item` is {title, url}; `metaElId`
  // is the id of that row's small status line, so we can flash "Opening…"/"Saved." next to it.
  function openResourceFile(item, metaElId) {
    var meta = document.getElementById(metaElId);
    var original = meta ? meta.textContent : "";
    if (meta) meta.textContent = "Opening…";
    fetchFileBlob(item.url).then(function (blob) {
      var blobUrl = URL.createObjectURL(blob);
      openModal(
        "<h3>" + esc(item.title) + "</h3>" +
        '<iframe src="' + blobUrl + '" title="' + esc(item.title) + '" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:10px"></iframe>',
        { wide: true }
      );
      if (meta) meta.textContent = original;
    }).catch(function () {
      if (meta) meta.textContent = "Couldn’t open that file here — try Save instead.";
    });
  }

  // Resource URLs come in two shapes (see resources collection): a path-style
  // URL like "worksheets/Maths_Y4Pt2/M01_..._Worksheet.pdf" ends in a real
  // filename, but a blob-style URL like "/_blob/04ebbf7347811289131a1157d3fa6dc1"
  // is a bare asset id with no extension at all. Naming the download from the
  // last URL segment left every blob-style resource (most of the library)
  // with an extensionless filename, which the downloads capability always
  // rejects as "This file type can’t be saved here." — nothing to do with
  // the file itself. Building the filename from the resource's own title
  // (always present, always a PDF) works for both URL shapes.
  function resourceFilename(item) {
    var base = (item.title || "worksheet").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
    return base + ".pdf";
  }

  function downloadResourceFile(item, metaElId) {
    var meta = document.getElementById(metaElId);
    var original = meta ? meta.textContent : "";
    if (meta) meta.textContent = "Preparing…";
    fetchFileBlob(item.url).then(function (blob) {
      triggerBrowserDownload(blob, resourceFilename(item));
      if (meta) meta.textContent = "Saved.";
      setTimeout(function () { if (meta && meta.textContent === "Saved.") meta.textContent = original; }, 1800);
    }).catch(function () {
      var errMsg = "Couldn’t load that file to save it — try again.";
      if (meta) meta.textContent = errMsg;
      setTimeout(function () { if (meta && meta.textContent === errMsg) meta.textContent = original; }, 2600);
    });
  }

  // A self-service copy of everything the portal holds under this account — profile,
  // lesson history, requests, and reviews — as one JSON file the family can keep.
  // Every call here already comes back scoped to the signed-in parent by the API
  // itself, so there's no separate filtering to get right (or wrong) client-side.
  function wireDataExport() {
    var btn = document.getElementById("dataExportBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var msg = document.getElementById("dataExportMsg");
      msg.textContent = ""; msg.className = "msg";
      btn.disabled = true;
      Promise.all([
        apiFetch("/api/me"),
        getStore().then(function (s) { return s ? s.listBookings() : []; }),
        getStore().then(function (s) { return s ? s.listRequests() : []; }),
        getStore().then(function (s) { return s ? s.listMyReviews() : []; })
      ]).then(function (res) {
        var payload = {
          exportedAt: new Date().toISOString(),
          profile: res[0].user,
          bookings: res[1],
          requests: res[2],
          reviews: res[3]
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "passframe-my-data-" + todayIso() + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        btn.disabled = false;
      }).catch(function (err) {
        btn.disabled = false;
        msg.textContent = err.message || "Couldn’t put that together — try again in a moment.";
        msg.className = "msg error";
      });
    });
  }

  var reviewRatingSelected = 0;
  function wireReviewForm() {
    reviewRatingSelected = 0;
    var starBtns = document.querySelectorAll("#reviewStars [data-star]");
    Array.prototype.forEach.call(starBtns, function (btn) {
      btn.addEventListener("click", function () {
        reviewRatingSelected = Number(btn.getAttribute("data-star"));
        Array.prototype.forEach.call(starBtns, function (b2) {
          b2.classList.toggle("on", Number(b2.getAttribute("data-star")) <= reviewRatingSelected);
        });
      });
    });
    var sendBtn = document.getElementById("reviewSend");
    if (!sendBtn) return;
    sendBtn.addEventListener("click", function () {
      var commentEl = document.getElementById("reviewComment");
      var comment = commentEl.value.trim();
      var msg = document.getElementById("reviewMsg");
      msg.textContent = ""; msg.className = "msg";
      if (!comment) { msg.textContent = "Write a few words before sending."; msg.className = "msg error"; return; }
      getStore().then(function (s) { return s.addReview({ comment: comment, rating: reviewRatingSelected || null }); })
        .then(function () {
          msg.textContent = "Thank you — your review has been sent."; msg.className = "msg ok";
          commentEl.value = "";
          reviewRatingSelected = 0;
          Array.prototype.forEach.call(starBtns, function (b2) { b2.classList.remove("on"); });
          loadMyReviewsList();
        })
        .catch(function (err) { msg.textContent = err.message || "Couldn’t send that — try again."; msg.className = "msg error"; });
    });

  function tutorByEmailForParent(email) {

  function parentNextLessonLabel(bookings) {
    var t = todayIso();
    var upcoming = bookings.filter(function (b) { return b.date >= t; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (!upcoming.length) return "No lessons scheduled";
    var next = upcoming[0];
    var days = Math.round((new Date(next.date + "T00:00:00") - new Date(t + "T00:00:00")) / 86400000);
    var when = days === 0 ? "today" : days === 1 ? "tomorrow" : "in " + days + " days";
    var tutor = tutorByEmailForParent(next.tutorEmail);
    return "Lesson " + when + " with " + (tutor ? tutor.name : "your tutor");
  }

      getStore().then(function (s) { return s ? s.listUsers() : []; }),
      getStore().then(function (s) { return s ? s.listAvailability() : []; })
    ]).then(function (res) {
      var allRequests = res[0], allBookings = res[1], allUsers = res[2], allAvailability = res[3];
      var tutors = allUsers.filter(function (u) { return u.role === "tutor"; })
        .sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });

      function tutorName(email) {

            (!a.studentEmail || a.studentEmail === state.user.email);

              return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(formatDateLabel(a.date)) + "</strong>" +
                '<span>' + esc(a.start) + "–" + esc(a.end) + "</span></div>" +
                '<div class="day-slot-actions"><button type="button" class="btn secondary small" data-use-avail="' + esc(a.date) + "|" + esc(a.start) + "|" + esc(a.end) + '">Use this time</button></div></div>';
            }).join("") + "</div>"
          : "";
        var box = document.getElementById("reqTutorAvail");
        if (box) {
          box.innerHTML = html;
          Array.prototype.forEach.call(box.querySelectorAll("[data-use-avail]"), function (btn) {
            btn.addEventListener("click", function () {
              var parts = btn.getAttribute("data-use-avail").split("|");
              document.getElementById("reqFirstDateP").value = parts[0];
              document.getElementById("reqStartP").value = parts[1];
              document.getElementById("reqEndP").value = parts[2];
            });
          });
        }
      }

      var incoming = allRequests.filter(function (r) { return r.parentEmail === state.user.email && r.direction === "tutor-to-parent" && r.status === "pending"; });
      var sent = allRequests.filter(function (r) { return r.parentEmail === state.user.email && r.direction === "parent-to-tutor"; })
        .sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); });
      var renewals = getRenewalCandidates(allRequests, allBookings, state.user.email, "parentEmail");

      var renewalsHtml = renewals.map(function (x) {
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(tutorName(x.request.tutorEmail)) + "</strong>" +
          '<span>Every ' + esc(weekdayName(x.request.firstDate)) + ", " + esc(x.request.start) + "–" + esc(x.request.end) + " · ends " + esc(formatDateLabel(x.lastDate)) + "</span></div>" +
          '<div class="day-slot-actions"><button class="btn small" data-renew-req="' + x.request.id + '">Send renewal request</button></div></div>';
      }).join("");

      var incomingHtml = incoming.length ? incoming.map(function (r) {
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(tutorName(r.tutorEmail)) + "</strong>" +
          '<span>' + esc(requestScheduleText(r)) + "</span></div>" +
          '<div class="day-slot-actions">' +
            '<button class="btn small" data-accept-req="' + r.id + '">Accept</button>' +
            '<button class="btn danger small" data-decline-req="' + r.id + '">Decline</button>' +
          "</div></div>";
      }).join("") : '<p class="empty">No incoming requests right now.</p>';

      var sentHtml = sent.length ? sent.map(function (r) {
        var withdrawBtn = r.status === "pending" ? '<button class="btn danger small" data-withdraw-req="' + r.id + '">Withdraw</button>' : "";
        return '<div class="day-slot-item"><div class="day-slot-main"><strong>' + esc(tutorName(r.tutorEmail)) + "</strong>" +
          '<span>' + esc(requestScheduleText(r)) + " · " + requestStatusLabel(r.status) + "</span></div>" +
          '<div class="day-slot-actions">' + withdrawBtn + "</div></div>";
      }).join("") : '<p class="empty">You haven’t sent any requests yet — use the form below to request a lesson from one of your tutors.</p>';

      var dateLabelP = composeKind === "oneoff" ? "Session date" : "First lesson date";

      el.innerHTML =
        (renewals.length ? ('<h4 style="font-size:0.9rem;margin:0 0 8px">Ending soon</h4><div class="day-slot-list">' + renewalsHtml + "</div>") : "") +
        '<h4 style="font-size:0.9rem;margin:16px 0 8px">Incoming requests</h4>' +
        '<div class="day-slot-list">' + incomingHtml + "</div>" +
        '<h4 style="font-size:0.9rem;margin:20px 0 8px">Request a tutor</h4>' +
        '<p style="color:var(--muted);font-size:0.85rem;margin-top:-6px">Missed a lesson, or need an extra session this week? Use "One-off session" for a single date instead of a 4-week block.</p>' +
        '<div class="cat-tabs" style="margin-bottom:2px">' +
          '<button type="button" class="tab-btn small" data-reqkindp="recurring" aria-selected="' + (composeKind === "recurring") + '">Recurring (4 weeks)</button>' +
          '<button type="button" class="tab-btn small" data-reqkindp="oneoff" aria-selected="' + (composeKind === "oneoff") + '">One-off session</button>' +
        "</div>" +
        '<label for="reqTutor">Tutor</label>' +
        '<select id="reqTutor">' + (tutors.length ? tutors.map(function (t) {
          return '<option value="' + esc(t.email) + '">' + esc(t.name) + "</option>";
        }).join("") : '<option value="">No tutors available yet</option>') + "</select>" +
        '<div id="reqTutorAvail"></div>' +
        '<label for="reqFirstDateP">' + dateLabelP + "</label>" +
        '<input type="date" id="reqFirstDateP">' +
        '<div class="field-row">' +
          '<div><label for="reqStartP">Start time</label><input type="time" id="reqStartP" value="16:00"></div>' +
          '<div><label for="reqEndP">End time</label><input type="time" id="reqEndP" value="17:00"></div>' +
        "</div>" +
        '<button class="btn" id="reqSendP" style="margin-top:16px;width:100%">Send request</button>' +
        '<div class="msg" id="reqMsgP"></div>' +
        '<h4 style="font-size:0.9rem;margin:20px 0 8px">Your sent requests</h4>' +
        '<div class="day-slot-list">' + sentHtml + "</div>";

      var tutorSelect = document.getElementById("reqTutor");
      if (tutorSelect && tutorSelect.value) {
        renderTutorAvailList(tutorSelect.value);
        tutorSelect.addEventListener("change", function () { renderTutorAvailList(tutorSelect.value); });
      }

      Array.prototype.forEach.call(el.querySelectorAll("[data-reqkindp]"), function (btn) {
        btn.addEventListener("click", function () { renderParentRequests(btn.getAttribute("data-reqkindp")); });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-accept-req]"), function (btn) {
        btn.addEventListener("click", function () {
          var r = allRequests.filter(function (x) { return x.id === btn.getAttribute("data-accept-req"); })[0];
          if (!r) return;
          acceptRequest(r).then(function () { renderParentRequests(composeKind); loadMyBookings(); });
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-decline-req]"), function (btn) {
        btn.addEventListener("click", function () {
          var r = allRequests.filter(function (x) { return x.id === btn.getAttribute("data-decline-req"); })[0];
          if (!r) return;
          declineRequest(r).then(function () { renderParentRequests(composeKind); });
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-withdraw-req]"), function (btn) {
        btn.addEventListener("click", function () {
          var r = allRequests.filter(function (x) { return x.id === btn.getAttribute("data-withdraw-req"); })[0];
          if (!r) return;
          withdrawRequest(r).then(function () { renderParentRequests(composeKind); });
        });
      });
      Array.prototype.forEach.call(el.querySelectorAll("[data-renew-req]"), function (btn) {
        btn.addEventListener("click", function () {
          var x = renewals.filter(function (y) { return y.request.id === btn.getAttribute("data-renew-req"); })[0];
          if (!x) return;
          var r = x.request;
          getStore().then(function (s) {
            return s.addRequest({
              direction: "parent-to-tutor", tutorEmail: r.tutorEmail, parentEmail: r.parentEmail,
              childName: r.childName, cohort: r.cohort, kind: "recurring", firstDate: x.nextFirst, start: r.start, end: r.end,
              status: "pending", createdAt: new Date().toISOString(), renewalOf: r.id
            });
          }).then(function () { renderParentRequests(composeKind); });
        });
      });

      document.getElementById("reqSendP").addEventListener("click", function () {
        var msg = document.getElementById("reqMsgP");
        msg.textContent = ""; msg.className = "msg";
        var tutorEmail = document.getElementById("reqTutor").value;
        var firstDate = document.getElementById("reqFirstDateP").value;
        var start = document.getElementById("reqStartP").value;
        var end = document.getElementById("reqEndP").value;
        if (!tutorEmail) { msg.textContent = "Pick a tutor first."; msg.className = "msg error"; return; }
        if (!firstDate) { msg.textContent = "Pick a date."; msg.className = "msg error"; return; }
        if (!start || !end || start >= end) { msg.textContent = "Check the start and end time."; msg.className = "msg error"; return; }
        getStore().then(function (s) {
          if (!s) { msg.textContent = "Storage unavailable right now."; msg.className = "msg error"; return; }
          return s.addRequest({
            direction: "parent-to-tutor", tutorEmail: tutorEmail, parentEmail: state.user.email,
            childName: state.user.childName, cohort: state.user.cohort, kind: composeKind, firstDate: firstDate, start: start, end: end,
            status: "pending", createdAt: new Date().toISOString()
          });
        }).then(function () { renderParentRequests(composeKind); }).catch(function () { msg.textContent = "Couldn’t send — check your access."; msg.className = "msg error"; });
      });
    }).catch(function () { el.innerHTML = errorStateHtml("Couldn’t load requests."); });
  }

  function loadMyBookings() {
    var el = document.getElementById("myBookings");
    if (!el) return;
    el.innerHTML = skeletonListHtml(3);
    Promise.all([
      getStore().then(function (s) { return s ? s.listBookings() : []; }),
      getStore().then(function (s) { return s ? s.listUsers() : []; })
    ]).then(function (res) {
      var allBookings = res[0], allUsers = res[1];
      var mine = allBookings.filter(function (b) { return b.parentEmail === state.user.email; });
      if (!mine.length) { el.innerHTML = '<p class="empty">No lessons booked yet — once you book a session with a tutor, it’ll show up here.</p>'; return; }
      mine.sort(function (a, b) { return (a.date + a.start).localeCompare(b.date + b.start); });
      el.innerHTML = mine.map(function (b) {
        var tutor = allUsers.filter(function (u) { return u.email === b.tutorEmail; })[0];
        var joinBtn = (tutor && tutor.teamsLink)
          ? '<a class="btn secondary small" href="' + esc(tutor.teamsLink) + '" target="_blank" rel="noopener">Join Teams call</a>'
          : "";
        return '<div class="slot-item"><div class="slot-main"><span class="slot-day">' + esc(formatDateLabel(b.date)) + " · " + esc(tutor ? tutor.name : "Tutor") + "</span>" +
          '<span class="slot-time">' + esc(b.start) + "–" + esc(b.end) + "</span></div>" +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' + joinBtn +
          '<button class="btn danger small" data-bid="' + b.id + '">Cancel</button></div></div>';
      }).join("");
      Array.prototype.forEach.call(el.querySelectorAll("[data-bid]"), function (btn) {
        btn.addEventListener("click", function () {
          getStore().then(function (s) { return s.deleteBooking(btn.getAttribute("data-bid")); }).then(loadMyBookings);
        });
      });
    }).catch(function () { el.innerHTML = errorStateHtml("Couldn’t load your lessons."); });
  }

  // Parents only ever see resources for their own child's year group and exam board — unlike
  // the tutor-side resource browser, there's no board/year tab to switch away from that, just
  // a label showing which one is active. Category and subject (what the resource actually is)
  // stay freely browsable.
  function renderParentResourceTabs(activeCat, activeSub) {
    activeCat = activeCat || RES_CATEGORIES[0];
    var hasSub = RES_CATEGORIES_WITH_SUBJECTS.indexOf(activeCat) !== -1;
    activeSub = hasSub ? (activeSub || RES_SUBJECTS[0]) : null;
    var activeBoard = (state.user && state.user.board) || "combined";
    var activeYear = hasSub ? ((state.user && state.user.cohort) || RES_YEARGROUPS[0].id) : null;

    var searchWrap = document.getElementById("resSearchWrapP");
    searchWrap.innerHTML = '<input type="search" id="resSearchP" placeholder="Search resources by title…">';
    wireResourceSearch("resSearchP", "resListP", "resMetaP", false,
      function () { return loadParentResourceList(activeCat, activeSub, activeBoard, activeYear); });

    var boardTabsEl = document.getElementById("resBoardTabsP");
    boardTabsEl.innerHTML = '<span class="role-tag small">' + esc(boardLabel(activeBoard)) + "</span>";

    var tabsEl = document.getElementById("resTabsP");
    tabsEl.innerHTML = RES_CATEGORIES.map(function (c) {
      return '<button class="tab-btn" data-catp="' + esc(c) + '" aria-selected="' + (c === activeCat) + '">' + esc(c) + "</button>";
    }).join("");
    Array.prototype.forEach.call(tabsEl.querySelectorAll("[data-catp]"), function (btn) {
      btn.addEventListener("click", function () { renderParentResourceTabs(btn.getAttribute("data-catp"), null); });
    });

    var subTabsEl = document.getElementById("resSubTabsP");
    var yearTabsEl = document.getElementById("resYearTabsP");
    if (hasSub) {
      subTabsEl.style.display = "";
      subTabsEl.innerHTML = RES_SUBJECTS.map(function (s) {
        return '<button class="tab-btn small" data-subp="' + esc(s) + '" aria-selected="' + (s === activeSub) + '">' + esc(s) + "</button>";
      }).join("");
      Array.prototype.forEach.call(subTabsEl.querySelectorAll("[data-subp]"), function (btn) {
        btn.addEventListener("click", function () { renderParentResourceTabs(activeCat, btn.getAttribute("data-subp")); });
      });
      yearTabsEl.style.display = "";
      yearTabsEl.innerHTML = '<span class="role-tag small">' + esc(cohortLabel(activeYear)) + "</span>";
    } else {
      subTabsEl.style.display = "none";
      subTabsEl.innerHTML = "";
      yearTabsEl.style.display = "none";
      yearTabsEl.innerHTML = "";
    }

    loadParentResourceList(activeCat, activeSub, activeBoard, activeYear);
  }

  function loadParentResourceList(cat, sub, board, year) {
    var listEl = document.getElementById("resListP");
    if (!listEl) return;
    listEl.innerHTML = skeletonListHtml(3);
    getStore().then(function (s) { return s ? s.listResources() : []; }).then(function (all) {
      var mine = all.filter(function (r) {
        return r.category === cat && (sub ? r.subject === sub : !r.subject) &&
          resourceMatchesBoard(r, board) && resourceMatchesYear(r, year);
      });
      mine.sort(function (a, b) { return (a.title || "").localeCompare(b.title || "", undefined, { numeric: true }); });
      if (!mine.length) { listEl.innerHTML = '<p class="empty">Nothing here yet — try a different tab, or search by title above.</p>'; return; }
      renderResourceItems(listEl, mine, "resMetaP", false, function () { loadParentResourceList(cat, sub, board, year); });
    }).catch(function () { listEl.innerHTML = errorStateHtml("Couldn’t load resources."); });
  }

  // ---------- theme ----------
  // The inline head script already applied any saved choice before first paint (so the page
  // never flashes the wrong theme); this just syncs the toggle button's own icon/label to
  // that and wires the click. With no saved choice, the toggle reflects (and the very first
  // click flips away from) whatever the OS prefers right now.
  function wireThemeToggle() {
    var btn = document.getElementById("themeToggle");
    if (!btn) return;
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

    function isDark() {
      var saved = document.documentElement.getAttribute("data-theme");
      if (saved === "dark") return true;
      if (saved === "light") return false;
      return prefersDark;
    }
    function sync() {
      var dark = isDark();
      btn.innerHTML = dark ? "&#127769;" : "&#9728;";
      btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    }
    sync();

    btn.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("passframe_theme", next); } catch (e) {}
      sync();
    });
  }

  // ---------- boot ----------
  function boot() {
    try {
      var savedUser = sessionStorage.getItem("passframe_portal_user");
      var savedToken = sessionStorage.getItem("passframe_portal_token");
      if (savedUser && savedToken) {
        state.user = JSON.parse(savedUser);
        state.sessionToken = savedToken;
      }
    } catch (e) {}

    wireThemeToggle();
    renderAll();
    checkResetTokenInUrl();
  }

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", boot); } else { boot(); }

  window.__PORTAL_APP__ = { state: state, renderAll: renderAll, cohortLabel: cohortLabel };
})();
</script>
